// ---------- CLIENTES ----------
let clientSearch='';
let clientFilter='todos';
function clientesView(){
  const wrap=document.createElement('div');

  if(appScreen==='grupos'){
    return gruposListView();
  }

  const toolbar=document.createElement('div');
  toolbar.className='toolbar';
  toolbar.innerHTML=`<input class="search" placeholder="Buscar cliente..." value="${clientSearch}">`;
  const search=toolbar.querySelector('input');
  search.oninput=(e)=>{ clientSearch=e.target.value; renderGrid(); };
  const filterSelect=document.createElement('select'); filterSelect.className='search'; filterSelect.style.minWidth='150px';
  filterSelect.innerHTML=`<option value="todos">Todos los estados</option><option value="activos">Solo activos</option><option value="inactivos">Solo inactivos</option>`;
  filterSelect.value=clientFilter;
  filterSelect.onchange=(e)=>{ clientFilter=e.target.value; renderGrid(); };
  toolbar.appendChild(filterSelect);
  const addBtn=document.createElement('button');
  addBtn.className='btn btn-accent';
  addBtn.textContent='+ Nuevo cliente';
  addBtn.onclick=()=>openClientModal(null);
  toolbar.appendChild(addBtn);
  wrap.appendChild(toolbar);

  const avisos = clientsWithUpcomingAviso();
  if(avisos.length>0){
    const avisoBox=document.createElement('div'); avisoBox.className='warn-banner';
    avisoBox.innerHTML = '🔔 <strong>Avisos próximos:</strong><br>' + avisos.map(a=>{
      const accion = a.tipo==='inicio' ? 'empieza' : 'se reactiva';
      return `${escapeHtml(a.nombre)} ${accion} el ${a.fecha} (faltan ${daysUntil(a.fecha)} días) — concretar el entrenamiento.`;
    }).join('<br>');
    wrap.appendChild(avisoBox);
  }

  const gridHolder=document.createElement('div');
  wrap.appendChild(gridHolder);

  function buildClientCard(c){
    const card=document.createElement('div');
    card.className='card'+(c.activo===false?' inactive':'');
    const cuidados = [c.salud.lesionOperacion, c.salud.evitar].filter(v=>v && !/^no$/i.test(v.trim())).join(' · ') || 'Sin antecedentes relevantes';
    const parejaTag = c.pareja ? `En pareja con ${c.pareja}` : 'Individual';
    let estadoExtra = '';
    if(c.pendienteInicio && c.fechaInicio){
      estadoExtra = `<span class="tag tag-inactive">Pendiente de inicio (${daysUntil(nextBusinessDay(c.fechaInicio))} días)</span>`;
    } else if(c.pausaFin){
      estadoExtra = `<span class="tag tag-inactive">Pausa programada hasta ${c.pausaFin}</span>`;
    }
    card.innerHTML=`
      <span class="tag">${parejaTag}</span>
      ${c.activo===false?'<span class="tag tag-inactive">Inactivo</span>':''}
      ${estadoExtra}
      <h3>${c.nombre}</h3>
      <p><strong>Objetivo:</strong> ${c.objetivos.principal||'—'}</p>
      <p><strong>Zona a mejorar:</strong> ${c.objetivos.zona||'—'}</p>
      <p><strong>Días/semana:</strong> ${c.objetivos.dias||'—'}</p>
      <p><strong>Cuidados:</strong> ${cuidados}</p>
      ${c.activo===false?`<p><strong>Inicio previsto:</strong> ${c.fechaInicio||'—'}</p>`:''}
    `;
    const actions=document.createElement('div');
    actions.className='actions';
    const viewBtn=document.createElement('button'); viewBtn.className='btn btn-sm'; viewBtn.textContent='Ver ficha';
    viewBtn.onclick=()=>openClientModal(c.id);
    const sesBtn=document.createElement('button'); sesBtn.className='btn btn-sm btn-accent'; sesBtn.textContent='Sesiones →';
    sesBtn.onclick=()=>{ state.activeClientId=c.id; state.activeTab='sesiones'; render(); };
    const toggleBtn=document.createElement('button'); toggleBtn.className='btn btn-sm btn-ghost';
    toggleBtn.textContent = c.activo===false ? 'Reactivar' : 'Marcar inactivo';
    toggleBtn.onclick=()=>{ c.activo = c.activo===false ? true : false; c.pendienteInicio=false; scheduleSave(); render(); };
    const dateWrap=document.createElement('label'); dateWrap.style.cssText='display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-soft);';
    dateWrap.innerHTML=`Inicio: `;
    const dateInput=document.createElement('input'); dateInput.type='date'; dateInput.value=c.fechaInicio||'';
    dateInput.style.cssText='padding:4px 6px;border:1px solid var(--line);border-radius:5px;font-size:11.5px;background:var(--bg);color:var(--ink);';
    dateInput.onchange=()=>{
      c.fechaInicio=dateInput.value;
      if(c.fechaInicio){
        const eff=nextBusinessDay(c.fechaInicio);
        if(todayStr() < eff){ c.pendienteInicio=true; c.activo=false; }
        else { c.pendienteInicio=false; }
      } else { c.pendienteInicio=false; }
      scheduleSave(); render();
    };
    dateWrap.appendChild(dateInput);
    actions.appendChild(viewBtn); actions.appendChild(sesBtn); actions.appendChild(toggleBtn); actions.appendChild(dateWrap);
    card.appendChild(actions);
    return card;
  }

  function renderSection(container, title, clientList){
    if(clientList.length===0) return;
    const heading=document.createElement('h3');
    heading.style.cssText='font-family:\'IBM Plex Mono\',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:18px 0 10px;';
    heading.textContent=title+` (${clientList.length})`;
    container.appendChild(heading);
    const grid=document.createElement('div'); grid.className='grid';
    clientList.forEach(c=>grid.appendChild(buildClientCard(c)));
    container.appendChild(grid);
  }

  function renderGrid(){
    gridHolder.innerHTML='';
    let list = screenClients().filter(c=>normalizarBusqueda(c.nombre).includes(normalizarBusqueda(clientSearch)));
    if(clientFilter==='activos') list = list.filter(c=>c.activo!==false);
    if(clientFilter==='inactivos') list = list.filter(c=>c.activo===false);
    if(list.length===0){
      gridHolder.innerHTML = `<div class="empty"><h3>Sin resultados</h3><p>Prueba otro nombre, cambia el filtro de estado o crea una nueva ficha.</p></div>`;
      return;
    }
    if(clientFilter==='todos'){
      renderSection(gridHolder, 'Activos', list.filter(c=>c.activo!==false));
      renderSection(gridHolder, 'Inactivos', list.filter(c=>c.activo===false));
    } else {
      renderSection(gridHolder, clientFilter==='activos'?'Activos':'Inactivos', list);
    }
  }
  renderGrid();
  return wrap;
}

    c.cuerpo={altura:g('f-altura'),pesoActual:g('f-pesoActual'),pesoDeseado:g('f-pesoDeseado'),ejercicioRegular:g('f-ejercicioRegular'),nivelForma:g('f-nivelForma'),estres:g('f-estres'),sueno:g('f-sueno'),alimentacion:g('f-alimentacion'),fumaAlcohol:g('f-fumaAlcohol')};
    c.objetivos={principal:g('f-principal'),zona:g('f-zona'),dias:g('f-dias'),preferencia:g('f-preferencia')};
    c.notas=g('f-notas');
    const idx=state.clients.findIndex(x=>x.id===c.id);
    if(idx===-1) state.clients.push(c); else state.clients[idx]=c;
    scheduleSave(); overlay.remove(); render();
  };
}

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// Si el ejercicio no tiene imagenUrl puesta a mano, probamos a adivinarla sola: "ejercicios/<nombre exacto>.<extensión>",
// probando varias extensiones habituales por si el archivo subido no es exactamente .jpg.
const EXTENSIONES_IMAGEN_PROBABLES = ['jpg','jpeg','png','webp'];
function candidatosImagenPorNombre(ex){
  if(!ex || !ex.nombre) return [];
  const base = 'ejercicios/' + encodeURIComponent(ex.nombre);
  return EXTENSIONES_IMAGEN_PROBABLES.map(ext => `${base}.${ext}`);
}
// Genera el HTML de una imagen de ejercicio con reintento automático de extensiones y hueco de "sin imagen" si no hay ninguna.
function htmlImagenEjercicio(ex, claseImg){
  const explicita = ex && ex.imagenUrl ? ex.imagenUrl.trim() : '';
  const candidatos = explicita ? [explicita, ...candidatosImagenPorNombre(ex)] : candidatosImagenPorNombre(ex);
  if(candidatos.length===0) return '';
  const primero = candidatos[0];
  const resto = candidatos.slice(1).map(c=>escapeHtml(c));
  return `<img src="${escapeHtml(primero)}" class="${claseImg||''}" alt="${escapeHtml(ex.nombre)}" data-fallbacks='${JSON.stringify(resto)}' onerror="manejarErrorImagenEjercicio(this)">`;
}
function manejarErrorImagenEjercicio(imgEl){
  let restantes = [];
  try{ restantes = JSON.parse(imgEl.dataset.fallbacks||'[]'); }catch(e){}
  if(restantes.length>0){
    const siguiente = restantes.shift();
    imgEl.dataset.fallbacks = JSON.stringify(restantes);
    imgEl.src = siguiente;
  } else {
    const placeholder = document.createElement('div');
    placeholder.className = imgEl.className.includes('ex-foto') ? 'ex-foto-vacia' : 'ex-img-placeholder';
    if(placeholder.className==='ex-img-placeholder') placeholder.innerHTML = '📷<span>Sin imagen</span>';
    imgEl.replaceWith(placeholder);
  }
}
// Normaliza texto para búsquedas sin distinguir tildes/acentos (así "biceps" encuentra "Bíceps", "corazon" encuentra "corazón", etc.)
function normalizarBusqueda(str){ return (str||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

// Autocompletado de clientes: crea una lista de sugerencias visible debajo del input a medida que se escribe.
function crearAutocompleteCliente(inputEl, listaClientes, onSelect){
  const contenedor=document.createElement('div'); contenedor.style.cssText='position:relative;';
  inputEl.parentNode.insertBefore(contenedor, inputEl);
  contenedor.appendChild(inputEl);
  const sugerencias=document.createElement('div');
  sugerencias.style.cssText='position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-top:2px;max-height:180px;overflow-y:auto;z-index:60;display:none;box-shadow:0 6px 18px rgba(0,0,0,.35);';
  contenedor.appendChild(sugerencias);

  function ordenados(){ return [...listaClientes()].sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')); }

  function mostrarSugerencias(){
    const q=normalizarBusqueda(inputEl.value.trim());
    if(!q){ sugerencias.style.display='none'; sugerencias.innerHTML=''; return; }
    const coincidencias = ordenados().filter(c=>normalizarBusqueda(c.nombre).includes(q)).slice(0,8);
    if(coincidencias.length===0){
      sugerencias.innerHTML = `<div style="padding:8px 10px;font-size:12.5px;color:var(--ink-soft);">Sin coincidencias</div>`;
    } else {
      sugerencias.innerHTML = coincidencias.map(c=>`<div class="ac-item" data-id="${c.id}" style="padding:8px 10px;font-size:13px;cursor:pointer;color:var(--ink);">${escapeHtml(c.nombre)}</div>`).join('');
      sugerencias.querySelectorAll('.ac-item').forEach(item=>{
        item.onmouseenter=()=>{ item.style.background='var(--surface-2)'; };
        item.onmouseleave=()=>{ item.style.background='transparent'; };
        item.onclick=(e)=>{
          e.preventDefault();
          const cliente = listaClientes().find(c=>c.id===item.dataset.id);
          if(cliente) onSelect(cliente);
          inputEl.value='';
          sugerencias.style.display='none';
        };
      });
    }
    sugerencias.style.display='block';
  }
  inputEl.oninput = mostrarSugerencias;
  inputEl.onfocus = mostrarSugerencias;
  inputEl.onblur = ()=>{ setTimeout(()=>{ sugerencias.style.display='none'; }, 150); };
}
// Autocompletado genérico de texto libre: sugiere mientras se escribe a partir de una lista de strings
// (nombres de clientes, clases de grupo, u otros textos ya usados en el horario), y rellena el propio campo al elegir.
function crearAutocompleteTexto(inputEl, listaTextos){
  const contenedor=document.createElement('div'); contenedor.style.cssText='position:relative;';
  inputEl.parentNode.insertBefore(contenedor, inputEl);
  contenedor.appendChild(inputEl);
  const sugerencias=document.createElement('div');
  sugerencias.style.cssText='position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-top:2px;max-height:180px;overflow-y:auto;z-index:60;display:none;box-shadow:0 6px 18px rgba(0,0,0,.35);';
  contenedor.appendChild(sugerencias);
  function mostrarSugerencias(){
    const q=normalizarBusqueda(inputEl.value.trim());
    if(!q){ sugerencias.style.display='none'; sugerencias.innerHTML=''; return; }
    const unicos = [...new Set(listaTextos())].sort((a,b)=>a.localeCompare(b,'es'));
    const coincidencias = unicos.filter(t=>normalizarBusqueda(t).includes(q) && normalizarBusqueda(t)!==q).slice(0,8);
    if(coincidencias.length===0){ sugerencias.style.display='none'; sugerencias.innerHTML=''; return; }
    sugerencias.innerHTML = coincidencias.map(t=>`<div class="ac-item" style="padding:8px 10px;font-size:13px;cursor:pointer;color:var(--ink);">${escapeHtml(t)}</div>`).join('');
    sugerencias.querySelectorAll('.ac-item').forEach(item=>{
      item.onmouseenter=()=>{ item.style.background='var(--surface-2)'; };
      item.onmouseleave=()=>{ item.style.background='transparent'; };
      item.onclick=(e)=>{
        e.preventDefault();
        inputEl.value = item.textContent;
        sugerencias.style.display='none';
        inputEl.dispatchEvent(new Event('change'));
      };
    });
    sugerencias.style.display='block';
  }
  inputEl.addEventListener('input', mostrarSugerencias);
  inputEl.addEventListener('focus', mostrarSugerencias);
  inputEl.addEventListener('blur', ()=>{ setTimeout(()=>{ sugerencias.style.display='none'; }, 150); });
}
// Selector de filtro de valor único, buscable: escribes para filtrar la lista, seleccionas una opción, o borras el
// campo del todo para volver a "todos" (sin filtro). Muestra sugerencias mientras escribes.
function crearSelectorFiltroBuscable(inputEl, opciones, getValorActual, onSelect){
  const contenedor=document.createElement('div'); contenedor.style.cssText='position:relative;';
  inputEl.parentNode.insertBefore(contenedor, inputEl);
  contenedor.appendChild(inputEl);
  const sugerencias=document.createElement('div');
  sugerencias.style.cssText='position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-top:2px;max-height:200px;overflow-y:auto;z-index:60;display:none;box-shadow:0 6px 18px rgba(0,0,0,.35);';
  contenedor.appendChild(sugerencias);
  function mostrarSugerencias(){
    const q=normalizarBusqueda(inputEl.value.trim());
    const ordenadas = [...opciones].sort((a,b)=>a.localeCompare(b,'es'));
    const coincidencias = q ? ordenadas.filter(o=>normalizarBusqueda(o).includes(q)) : ordenadas;
    if(coincidencias.length===0){ sugerencias.style.display='none'; sugerencias.innerHTML=''; return; }
    sugerencias.innerHTML = coincidencias.slice(0,40).map(o=>`<div class="ac-item" data-v="${escapeHtml(o)}" style="padding:7px 10px;font-size:12.5px;cursor:pointer;color:var(--ink);">${escapeHtml(o)}</div>`).join('');
    sugerencias.querySelectorAll('.ac-item').forEach(item=>{
      item.onmouseenter=()=>{ item.style.background='var(--surface-2)'; };
      item.onmouseleave=()=>{ item.style.background='transparent'; };
      item.onclick=(e)=>{
        e.preventDefault();
        inputEl.value = item.dataset.v;
        sugerencias.style.display='none';
        onSelect(item.dataset.v);
      };
    });
    sugerencias.style.display='block';
  }
  inputEl.addEventListener('input', ()=>{
    if(!inputEl.value.trim() && getValorActual()){ onSelect(''); return; } // campo vaciado del todo: quita el filtro
    mostrarSugerencias();
  });
  inputEl.addEventListener('focus', mostrarSugerencias);
  inputEl.addEventListener('blur', ()=>{ setTimeout(()=>{ sugerencias.style.display='none'; }, 150); });
}
// Recopila todos los nombres/textos "conocidos" del sistema: clientes, clases de grupo y textos ya usados en el horario
function nombresConocidosParaHorario(){
  const nombres = new Set();
  state.clients.forEach(c=>nombres.add(c.nombre));
  state.grupos.forEach(clase=>nombres.add(clase.nombre));
  const recogerDe = (obj)=>{ Object.values(obj||{}).forEach(v=>{ const t=textoLimpio(v||'').trim(); if(t && t.toLowerCase()!=='oficina') nombres.add(t); }); };
  recogerDe(state.horario.grid);
  recogerDe(state.horario.excepciones);
  (state.horario.plantillasFuturas||[]).forEach(p=>recogerDe(p.grid));
  return [...nombres];
}

// Los diálogos nativos confirm()/alert() del navegador quedan bloqueados dentro de esta vista incrustada,
// así que usamos modales propios para confirmaciones y avisos.
function showConfirm(message, onConfirm){
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`
    <div class="modal" style="max-width:380px;">
      <p style="font-size:14px;color:var(--ink);margin:0 0 18px;">${escapeHtml(message)}</p>
      <div class="actions" style="justify-content:flex-end;">
        <button class="btn" id="cancel-confirm">Cancelar</button>
        <button class="btn btn-danger" id="ok-confirm">Confirmar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick=(e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#cancel-confirm').onclick=()=>overlay.remove();
  overlay.querySelector('#ok-confirm').onclick=()=>{ overlay.remove(); onConfirm(); };
}

// ---------- BATERIA DE EJERCICIOS ----------
let exSearch='';
let exGrupoFilter='';
let exMaterialFilter='';
let exTipoFilter='';
function bateriaView(){
  const wrap=document.createElement('div');
  const toolbar=document.createElement('div');
  toolbar.className='toolbar';
  toolbar.style.flexWrap='wrap';

  const gruposUnicos = ['Tren superior','Tren inferior', ...new Set(state.exercises.map(e=>e.grupoMuscular).filter(Boolean))].filter((v,i,a)=>a.indexOf(v)===i);
  const materialesUnicos = [...new Set(state.exercises.flatMap(e=>(e.material||'').split(',').map(m=>m.trim()).filter(Boolean)))].sort((a,b)=>a.localeCompare(b,'es'));

  toolbar.innerHTML=`
    <input class="search" placeholder="Buscar ejercicio...">
    <input class="search" id="ex-filtro-grupo" placeholder="Grupo muscular (todos)" style="min-width:170px;" value="${escapeHtml(exGrupoFilter||'')}">
    <input class="search" id="ex-filtro-material" placeholder="Material (todo)" style="min-width:170px;" value="${escapeHtml(exMaterialFilter||'')}">
    <select class="search" id="ex-filtro-tipo" style="min-width:170px;">
      <option value="">Todos los tipos</option>
      <option value="individual" ${exTipoFilter==='individual'?'selected':''}>Solo individual</option>
      <option value="pareja" ${exTipoFilter==='pareja'?'selected':''}>Solo en pareja</option>
      <option value="grupal" ${exTipoFilter==='grupal'?'selected':''}>Solo dinámica de grupo</option>
    </select>
  `;
  toolbar.querySelector('input.search').value=exSearch;
  toolbar.querySelector('input.search').oninput=(e)=>{exSearch=e.target.value; renderGrid();};
  crearSelectorFiltroBuscable(toolbar.querySelector('#ex-filtro-grupo'), gruposUnicos, ()=>exGrupoFilter, (v)=>{ exGrupoFilter=v; renderGrid(); });
  crearSelectorFiltroBuscable(toolbar.querySelector('#ex-filtro-material'), materialesUnicos, ()=>exMaterialFilter, (v)=>{ exMaterialFilter=v; renderGrid(); });
  toolbar.querySelector('#ex-filtro-tipo').onchange=(e)=>{ exTipoFilter=e.target.value; renderGrid(); };
  const addBtn=document.createElement('button');
  addBtn.className='btn btn-accent'; addBtn.textContent='+ Nuevo ejercicio';
  addBtn.onclick=()=>openExerciseModal(null);
  toolbar.appendChild(addBtn);
  wrap.appendChild(toolbar);

  const gridHolder=document.createElement('div');
  wrap.appendChild(gridHolder);

  function renderGrid(){
    gridHolder.innerHTML='';
    const list=state.exercises.filter(e=>{
      const coincideNombre = normalizarBusqueda(e.nombre).includes(normalizarBusqueda(exSearch));
      const coincideGrupo = !exGrupoFilter || grupoMuscularCoincideConFiltro(e.grupoMuscular, exGrupoFilter);
      const coincideMaterial = !exMaterialFilter || (e.material||'').split(',').map(m=>m.trim()).includes(exMaterialFilter);
      let coincideTipo = true;
      if(exTipoFilter==='individual') coincideTipo = !e.esPareja && !e.esDinamicaGrupal;
      else if(exTipoFilter==='pareja') coincideTipo = !!e.esPareja;
      else if(exTipoFilter==='grupal') coincideTipo = !!e.esDinamicaGrupal;
      return coincideNombre && coincideGrupo && coincideMaterial && coincideTipo;
    });
    if(list.length===0){
      gridHolder.innerHTML=`<div class="empty"><h3>Batería vacía</h3><p>Añade ejercicios con su descripción, grupo muscular, imagen (URL) y precauciones. Se usarán luego al montar las sesiones.</p></div>`;
      return;
    }
    const grid=document.createElement('div'); grid.className='grid';
    list.forEach(ex=>{
      const card=document.createElement('div'); card.className='card ex-card';
      const imgTag = htmlImagenEjercicio(ex, '');
      const imagenHtml = `
        <div class="ex-img-placeholder">📷<span>Sin imagen</span></div>
        ${imgTag}
      `;
      card.innerHTML=`
        <div class="ex-img-wrap">${imagenHtml}</div>
        <span class="tag">${escapeHtml(ex.grupoMuscular||'General')}</span>
        ${ex.esPareja?'<span class="tag" style="background:rgba(127,179,217,.16);color:var(--accent-b);">En pareja</span>':''}
        ${ex.esDinamicaGrupal?'<span class="tag" style="background:rgba(232,178,78,.16);color:var(--accent-2);">Dinámica de grupo</span>':''}
        <h3>${escapeHtml(ex.nombre)}</h3>
        <p>${escapeHtml(ex.descripcion||'')}</p>
        ${ex.videoUrl?`<p style="font-size:12px;"><a href="${escapeHtml(ex.videoUrl)}" target="_blank" rel="noopener" style="color:var(--accent);">▶ Ver vídeo</a></p>`:''}
        ${ex.material?`<p style="font-size:11.5px;"><strong>Material:</strong> ${escapeHtml(ex.material)}</p>`:''}
        ${ex.zonasRiesgo?`<p style="font-size:11.5px;"><strong>Precaución si:</strong> ${escapeHtml(ex.zonasRiesgo)}</p>`:''}
        ${ex.precauciones?`<div class="precaucion">⚠ ${escapeHtml(ex.precauciones)}</div>`:''}
      `;
      const actions=document.createElement('div'); actions.className='actions';
      const editBtn=document.createElement('button'); editBtn.className='btn btn-sm'; editBtn.textContent='Editar';
      editBtn.onclick=()=>openExerciseModal(ex.id);
      const delBtn=document.createElement('button'); delBtn.className='btn btn-sm btn-danger'; delBtn.textContent='Eliminar';
      delBtn.onclick=()=>{ showConfirm('¿Eliminar este ejercicio de la batería?', ()=>{ state.exercises=state.exercises.filter(x=>x.id!==ex.id); scheduleSave(); renderGrid(); }); };
      actions.appendChild(editBtn); actions.appendChild(delBtn);
      card.appendChild(actions);
      grid.appendChild(card);
    });
    gridHolder.appendChild(grid);
  }
  renderGrid();
  return wrap;
}

const RISK_ZONE_KEYWORDS = [
  [/sentadill|zancada|estocada|peso.?corporal.?pierna|prensa|leg press/, ['rodilla','cadera']],
  [/press.?banca|press.?pecho|aperturas|pec.?deck|flexion(es)?/, ['hombro','pecho']],
  [/press.?militar|press.?hombro|elevacion(es)?.?lateral|elevacion(es)?.?frontal|pajaro/, ['hombro']],
  [/remo|jalon|dominada|face pull|pull.?up/, ['hombro','espalda']],
  [/plancha|abdominal|crunch|elevacion(es)?.?de.?piernas|rueda abdominal/, ['abdomen','muñeca']],
  [/extension.?lumbar|buenos.?dias|hiperextension/, ['lumbar']],
  [/curl.?de.?muñeca|flexion.?de.?muñeca|pinza/, ['muñeca']],
  [/salto|burpee|escalador|pliometr|step|caja/, ['rodilla','tobillo']],
  [/giro|torsion|rotacion.?de.?tronco|russian twist/, ['columna','lumbar']],
  [/encogimiento|shrug|cuello|cervical/, ['cervical']],
  [/gluteo|hip thrust|puente/, ['cadera','lumbar']],
  [/curl.?biceps|triceps|fondos/, ['codo']],
  [/gemelo|pantorrilla|elevacion.?de.?talones/, ['tobillo']],
];
function suggestRiskZones(text){
  const found = new Set();
  RISK_ZONE_KEYWORDS.forEach(([re, zonas])=>{ if(re.test(text)) zonas.forEach(z=>found.add(z)); });
  return [...found];
}

function listaMaterialSala(){
  const textoLimpio = SALA.materialDisponible.replace(/\([^)]*\)/g, ''); // quita anotaciones entre paréntesis
  const items = textoLimpio.split(',')
    .map(m=>m.trim().replace(/\.$/,''))
    .filter(Boolean)
    .map(m=>m.charAt(0).toUpperCase()+m.slice(1));
  return [...new Set(items)].sort((a,b)=>a.localeCompare(b,'es'));
}

      <div style="margin:-4px 0 12px;">
        <button type="button" class="btn btn-sm" id="e-detectar-ia">🤖 Detectar ejercicio de la imagen con IA</button>
        <span id="e-detectar-estado" style="font-size:11.5px;color:var(--ink-soft);margin-left:8px;"></span>
      </div>
      <div class="field"><label>URL de vídeo (YouTube, enlace directo...)</label><input id="e-video" value="${escapeHtml(ex.videoUrl||'')}" placeholder="https://..."></div>
      <div class="field"><label>Descripción / técnica</label><textarea id="e-desc" style="min-height:70px;">${escapeHtml(ex.descripcion)}</textarea></div>
      <div class="field"><label>Material necesario (separado por comas)</label>
        <div style="display:flex;gap:8px;">
          <div style="position:relative;flex:1;">
            <input id="e-material" value="${escapeHtml(ex.material||'')}" placeholder="p.ej. Mancuernas, Banco" style="width:100%;padding-right:26px;">
            <select id="e-material-pick" style="position:absolute;top:0;right:0;bottom:0;width:24px;border:none;background:transparent;color:var(--accent);padding:0;font-size:11px;">
              <option value="" style="background:var(--surface);color:var(--ink-soft);"></option>
              ${listaMaterialSala().map(m=>`<option value="${escapeHtml(m)}" style="background:var(--surface);color:var(--ink);">${escapeHtml(m)}</option>`).join('')}
            </select>
          </div>
          <button type="button" class="btn btn-sm" id="e-suggest-material">Sugerir</button>
        </div>
      </div>
      <div class="field"><label>Precauciones / cuidados específicos</label><textarea id="e-precauciones">${escapeHtml(ex.precauciones)}</textarea></div>
      <div class="field"><label>Zonas o condiciones de riesgo (separadas por comas — el generador aleatorio evitará este ejercicio para clientes con coincidencias, p.ej. "hombro, cervical, cadera")</label>
        <div style="display:flex;gap:8px;">
          <input id="e-zonas" value="${escapeHtml(ex.zonasRiesgo||'')}" placeholder="hombro, cervical, cadera, abdomen, muñeca..." style="flex:1;">
          <button type="button" class="btn btn-sm" id="e-suggest">Sugerir</button>
        </div>
        <p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">La sugerencia se basa en el nombre y grupo muscular — revísala y ajústala tú, ya que solo tú conoces el detalle clínico real.</p>
      </div>
      <div id="e-warn"></div>
      <div class="actions" style="margin-top:16px;justify-content:flex-end;">
        <button class="btn btn-accent" id="save-ex">Guardar ejercicio</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.close-x').onclick=()=>overlay.remove();
  overlay.onclick=(e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#e-imagen-file').onchange=(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    if(file.size > 1.5*1024*1024){
      showAlert('Esa imagen pesa más de 1,5 MB. Para no llenar el espacio de guardado, usa una imagen más ligera o pega una URL en su lugar.');
      e.target.value=''; return;
    }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      overlay.querySelector('#e-imagen').value = ev.target.result;
      overlay.querySelector('#e-imagen-preview').innerHTML = `<img src="${ev.target.result}" style="max-height:90px;border-radius:6px;">`;
    };
    reader.readAsDataURL(file);
  };
  overlay.querySelector('#e-imagen').addEventListener('input', (e)=>{
    overlay.querySelector('#e-imagen-preview').innerHTML = e.target.value ? `<img src="${escapeHtml(e.target.value)}" style="max-height:90px;border-radius:6px;" onerror="this.style.display='none'">` : '';
  });
  overlay.querySelector('#e-detectar-ia').onclick=async()=>{
    const estadoEl = overlay.querySelector('#e-detectar-estado');
    const urlImagen = overlay.querySelector('#e-imagen').value.trim();
    if(!urlImagen){
      showAlert('Primero sube una imagen o pega una URL de imagen para poder analizarla.');
      return;
    }
    estadoEl.textContent = 'Analizando imagen...';
    try{
      let mediaType, base64Data;
      if(urlImagen.startsWith('data:')){
        const match = urlImagen.match(/^data:(image\/[a-zA-Z]+);base64,(.*)$/);
        if(!match){ throw new Error('Formato de imagen no reconocido.'); }
        mediaType = match[1]; base64Data = match[2];
      } else {
        const resp = await fetch(urlImagen);
        if(!resp.ok) throw new Error('No se pudo descargar la imagen desde esa URL.');
        const blob = await resp.blob();
        mediaType = blob.type && blob.type.startsWith('image/') ? blob.type : 'image/jpeg';
        base64Data = await new Promise((res,rej)=>{
          const r = new FileReader();
          r.onload = ()=>res(r.result.split(',')[1]);
          r.onerror = ()=>rej(new Error('No se pudo leer la imagen.'));
          r.readAsDataURL(blob);
        });
      }

      const promptTexto = `Eres un entrenador personal experto. Observa la imagen de este ejercicio de fitness e identifica de qué ejercicio se trata.
Responde ÚNICAMENTE con un objeto JSON (sin texto adicional, sin backticks de markdown) con estas claves exactas:
{"nombre": "nombre del ejercicio en español, usando el término en inglés si es de uso común en gimnasios (p.ej. 'Goblet Squat')",
"grupoMuscular": "grupo muscular principal en español",
"descripcion": "descripción breve de la técnica correcta, 1-2 frases",
"material": "material necesario separado por comas, eligiendo de esta lista si aplica: ${SALA.materialDisponible.replace(/\\./g,'')}. Si no requiere material, deja el string vacío.",
"precauciones": "precauciones o cuidados específicos de este ejercicio, 1 frase, o vacío si no aplica",
"zonasRiesgo": "zonas del cuerpo a las que hay que prestar atención por posibles lesiones, separadas por comas (p.ej. hombro, rodilla), o vacío si no aplica"}
Si la imagen no muestra un ejercicio de fitness identificable, responde con {"error": "no se reconoce ningún ejercicio en la imagen"}.`;

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
              { type: "text", text: promptTexto }
            ]
          }]
        })
      });
      if(!response.ok) throw new Error('Error al contactar con el servicio de IA.');
      const data = await response.json();
      const textBlock = (data.content||[]).find(b=>b.type==='text');
      if(!textBlock) throw new Error('Respuesta inesperada de la IA.');
      const limpio = textBlock.text.replace(/```json|```/g,'').trim();
      const resultado = JSON.parse(limpio);
      if(resultado.error){
        estadoEl.textContent = '';
        showAlert('No se ha reconocido ningún ejercicio claro en esa imagen. Prueba con otra foto o rellena los campos a mano.');
        return;
      }
      if(resultado.nombre) overlay.querySelector('#e-nombre').value = resultado.nombre;
      if(resultado.grupoMuscular) overlay.querySelector('#e-grupo').value = resultado.grupoMuscular;
      if(resultado.descripcion) overlay.querySelector('#e-desc').value = resultado.descripcion;
      if(resultado.material) overlay.querySelector('#e-material').value = resultado.material;
      if(resultado.precauciones) overlay.querySelector('#e-precauciones').value = resultado.precauciones;
      if(resultado.zonasRiesgo) overlay.querySelector('#e-zonas').value = resultado.zonasRiesgo;
      estadoEl.textContent = '✓ Detectado — revisa y ajusta los campos antes de guardar.';
    }catch(err){
      estadoEl.textContent = '';
      showAlert('No se pudo analizar la imagen (' + err.message + '). Puedes rellenar los campos a mano.');
    }
  };
  overlay.querySelector('#e-suggest').onclick=()=>{
    const text = (overlay.querySelector('#e-nombre').value+' '+overlay.querySelector('#e-grupo').value).toLowerCase();
    const suggestion = suggestRiskZones(text);
    overlay.querySelector('#e-zonas').value = suggestion.length ? suggestion.join(', ') : '';
    if(suggestion.length===0) showAlert('No he encontrado coincidencias claras por el nombre. Escribe tú las zonas de riesgo si aplica alguna.');
  };
  overlay.querySelector('#e-suggest-material').onclick=()=>{
    const text = (overlay.querySelector('#e-nombre').value+' '+overlay.querySelector('#e-grupo').value+' '+overlay.querySelector('#e-desc').value).toLowerCase();
    const suggestion = suggestMaterial(text);
    overlay.querySelector('#e-material').value = suggestion.length ? suggestion.join(', ') : '';
    if(suggestion.length===0) showAlert('No he encontrado coincidencias claras por el nombre/descripción. Escribe tú el material si aplica alguno.');
  };
  overlay.querySelector('#e-material-pick').onchange=(e)=>{
    const elegido = e.target.value;
    if(!elegido) return;
    const campo = overlay.querySelector('#e-material');
    const actuales = campo.value.split(',').map(m=>m.trim()).filter(Boolean);
    if(!actuales.some(m=>m.toLowerCase()===elegido.toLowerCase())) actuales.push(elegido);
    campo.value = actuales.join(', ');
    e.target.value = '';
  };
  overlay.querySelector('#save-ex').onclick=()=>{
    const nombre=overlay.querySelector('#e-nombre').value.trim();
    if(/peso muerto|deadlift/i.test(nombre)){
      overlay.querySelector('#e-warn').innerHTML=`<div class="warn-banner">⚠ El peso muerto está prohibido en esta sala. Elige una variante alternativa (p.ej. hip thrust, puente de glúteo, remo).</div>`;
      return;
    }
    ex.nombre = nombre || 'Sin nombre';
    ex.grupoMuscular = overlay.querySelector('#e-grupo').value;
    ex.imagenUrl = overlay.querySelector('#e-imagen').value;
    ex.videoUrl = overlay.querySelector('#e-video').value;
    ex.descripcion = overlay.querySelector('#e-desc').value;
    ex.material = overlay.querySelector('#e-material').value;
    ex.precauciones = overlay.querySelector('#e-precauciones').value;
    ex.zonasRiesgo = overlay.querySelector('#e-zonas').value;
    ex.esPareja = overlay.querySelector('#e-pareja').checked;
    ex.esDinamicaGrupal = overlay.querySelector('#e-dinamica-grupal').checked;
    const idx=state.exercises.findIndex(x=>x.id===ex.id);
    if(idx===-1) state.exercises.push(ex); else state.exercises[idx]=ex;
    scheduleSave(); overlay.remove(); render();
  };
}

// ---------- GRUPOS ----------
// Estructura: cada "clase" (Funcional, Pilates...) contiene varios "horarios" (franjas concretas, 2 días/semana cada uno).
let grupoSearch='';
let sesionClienteSearch='';
let clasesAbiertas={}; // recuerda qué tarjetas de clase están desplegadas

function findHorario(horarioId){
  for(const clase of state.grupos){
    const h = clase.horarios.find(x=>x.id===horarioId);
    if(h) return {clase, horario:h};
  }
  return null;
}

function gruposListView(){
  const wrap=document.createElement('div');
  const toolbar=document.createElement('div'); toolbar.className='toolbar';
  toolbar.innerHTML=`<input class="search" placeholder="Buscar horario (día, hora...)...">`;
  toolbar.querySelector('input').value=grupoSearch;
  toolbar.querySelector('input').oninput=(e)=>{ grupoSearch=e.target.value; renderGrid(); };
  const addBtn=document.createElement('button'); addBtn.className='btn btn-accent'; addBtn.textContent='+ Nueva categoría de clase';
  addBtn.onclick=()=>openClaseModal(null);
  toolbar.appendChild(addBtn);
  wrap.appendChild(toolbar);

  const holder=document.createElement('div');
  wrap.appendChild(holder);

  function renderGrid(){
    holder.innerHTML='';
    if(state.grupos.length===0){
      holder.innerHTML=`<div class="empty"><h3>Todavía no hay categorías de clase</h3><p>Crea "Funcional" o "Pilates" con "+ Nueva categoría de clase".</p></div>`;
      return;
    }
    const DIA_ORDEN = {'Lunes':1,'Martes':2,'Miércoles':3,'Jueves':4,'Viernes':5};
    const ordenarHorarios = (a,b)=>{
      const diaA = Math.min(...(a.dias&&a.dias.length?a.dias.map(d=>DIA_ORDEN[d]||99):[99]));
      const diaB = Math.min(...(b.dias&&b.dias.length?b.dias.map(d=>DIA_ORDEN[d]||99):[99]));
      if(diaA!==diaB) return diaA-diaB;
      return (a.hora||'').localeCompare(b.hora||'');
    };
    state.grupos.forEach(clase=>{
      const q=grupoSearch.toLowerCase();
      const horariosFiltrados = clase.horarios.filter(h=>{
        if(!q) return true;
        const texto = (clase.nombre+' '+(h.dias||[]).join(' ')+' '+h.hora).toLowerCase();
        return texto.includes(q);
      }).sort(ordenarHorarios);
      if(q && horariosFiltrados.length===0) return;

      const card=document.createElement('div'); card.className='card'; card.style.marginBottom='14px';
      const headWrap=document.createElement('div'); headWrap.style.cssText='display:flex;justify-content:space-between;align-items:flex-start;';
      headWrap.innerHTML=`<div>
          <h3>${escapeHtml(clase.nombre)}</h3>
          <p style="color:var(--ink-soft);font-size:12.5px;margin:2px 0 0;">${clase.horarios.length} horario${clase.horarios.length===1?'':'s'} configurado${clase.horarios.length===1?'':'s'}</p>
        </div>`;
      const headActions=document.createElement('div'); headActions.style.cssText='display:flex;gap:6px;';
      const editClaseBtn=document.createElement('button'); editClaseBtn.className='btn btn-sm'; editClaseBtn.textContent='Editar categoría';
      editClaseBtn.onclick=()=>openClaseModal(clase.id);
      headActions.appendChild(editClaseBtn);
      headWrap.appendChild(headActions);
      card.appendChild(headWrap);

      const details=document.createElement('details'); details.style.marginTop='10px';
      details.open = !!clasesAbiertas[clase.id] || !!q;
      details.ontoggle=()=>{ clasesAbiertas[clase.id]=details.open; };
      const summary=document.createElement('summary');
      summary.style.cssText='cursor:pointer;color:var(--accent);font-family:\'IBM Plex Mono\',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;';
      summary.textContent='▾ Ver horarios de esta clase';
      details.appendChild(summary);

      const listWrap=document.createElement('div'); listWrap.style.cssText='margin-top:10px;display:flex;flex-direction:column;gap:8px;';
      if(horariosFiltrados.length===0){
        listWrap.innerHTML=`<p style="font-size:12.5px;color:var(--ink-soft);">Sin horarios todavía.</p>`;
      }
      horariosFiltrados.forEach(h=>{
        const row=document.createElement('div');
        row.style.cssText='border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;';
        const aforoTxt = h.aforoMaximo ? `${h.inscritos.length}/${h.aforoMaximo} plazas${h.inscritos.length>h.aforoMaximo?' (lista de espera)':''}` : `${h.inscritos.length} inscritos`;
        row.innerHTML=`<div>
            <strong style="font-size:13.5px;">${(h.dias||[]).join(' y ')} · ${h.hora}</strong>
            <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">${aforoTxt} · ${h.weeks.length} semana${h.weeks.length===1?'':'s'} · inicio ${h.fechaInicio||'—'}</div>
          </div>`;
        const rowActions=document.createElement('div'); rowActions.style.cssText='display:flex;gap:6px;';
        const editBtn=document.createElement('button'); editBtn.className='btn btn-sm'; editBtn.textContent='Editar';
        editBtn.onclick=()=>openHorarioModal(clase.id, h.id);
        const planBtn=document.createElement('button'); planBtn.className='btn btn-sm btn-accent'; planBtn.textContent='Planificar →';
        planBtn.onclick=()=>{ state.activeGrupoId=h.id; state.activeTab='sesiones'; render(); };
        rowActions.appendChild(editBtn); rowActions.appendChild(planBtn);
        row.appendChild(rowActions);
        listWrap.appendChild(row);
      });
      const addHorarioBtn=document.createElement('button'); addHorarioBtn.className='btn btn-sm btn-accent'; addHorarioBtn.style.marginTop='4px';
      addHorarioBtn.textContent='+ Añadir horario a '+clase.nombre;
      addHorarioBtn.onclick=()=>openHorarioModal(clase.id, null);
      listWrap.appendChild(addHorarioBtn);
      details.appendChild(listWrap);
      card.appendChild(details);
      holder.appendChild(card);
    });
  }
  renderGrid();
  return wrap;
}

function openClaseModal(claseId){
  const isNew=!claseId;
  const clase = isNew ? {id:uid(), nombre:'', tipo:'dirigida', horarios:[]} : JSON.parse(JSON.stringify(state.grupos.find(x=>x.id===claseId)));
  const overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML=`
    <div class="modal" style="max-width:420px;">
      <div class="modal-head"><h2>${isNew?'Nueva categoría de clase':'Editar categoría'}</h2><button class="close-x">✕</button></div>
      <div class="field"><label>Nombre</label><input id="c-nombre" value="${escapeHtml(clase.nombre)}" placeholder="p.ej. Funcional, Pilates"></div>
      <div class="field"><label>Tipo</label>
        <select id="c-tipo">
          <option value="dirigida" ${clase.tipo==='dirigida'?'selected':''}>Dirigida (mismo ejercicio para todos)</option>
          <option value="rotativa" ${clase.tipo==='rotativa'?'selected':''}>Rotativa por estaciones</option>
        </select>
      </div>
      <div class="actions" style="margin-top:16px;justify-content:flex-end;">
        ${isNew?'':'<button class="btn btn-danger" id="c-del">Eliminar categoría</button>'}
        <button class="btn btn-accent" id="c-save">Guardar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.close-x').onclick=()=>overlay.remove();
  overlay.onclick=(e)=>{ if(e.target===overlay) overlay.remove(); };
  const delBtn=overlay.querySelector('#c-del');
  if(delBtn) delBtn.onclick=()=>{
    showConfirm('¿Eliminar esta categoría de clase y todos sus horarios?', ()=>{
      state.grupos = state.grupos.filter(x=>x.id!==clase.id);
      scheduleSave(); overlay.remove(); render();
    });
  };
  overlay.querySelector('#c-save').onclick=()=>{
    clase.nombre = overlay.querySelector('#c-nombre').value.trim() || 'Sin nombre';
    clase.tipo = overlay.querySelector('#c-tipo').value;
    const idx=state.grupos.findIndex(x=>x.id===clase.id);
    if(idx===-1) state.grupos.push(clase); else state.grupos[idx]=clase;
    scheduleSave(); overlay.remove(); render();
  };
}

      row.innerHTML = `<span>${escapeHtml(nombre)}</span>`;
      const rm=document.createElement('button'); rm.className='btn btn-sm btn-ghost'; rm.textContent='✕';
      rm.onclick=()=>{ h.inscritos.splice(i,1); renderInscritos(); };
      row.appendChild(rm);
      list.appendChild(row);
    });
  }
  renderInscritos();

  crearAutocompleteCliente(overlay.querySelector('#h-buscar-cliente'), ()=>state.clients, (cliente)=>{
    if(!h.inscritos.some(i=>i.tipo==='cliente' && i.clienteId===cliente.id)) h.inscritos.push({tipo:'cliente', clienteId:cliente.id});
    renderInscritos();
  });
  overlay.querySelector('#h-add-libre').onclick=()=>{
    const inp=overlay.querySelector('#h-nombre-libre');
    if(inp.value.trim()){ h.inscritos.push({tipo:'libre', nombre:inp.value.trim()}); inp.value=''; renderInscritos(); }
  };
  overlay.querySelector('#h-nombre-libre').addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){
      e.preventDefault();
      overlay.querySelector('#h-add-libre').click();
    }
  });

  const delBtn=overlay.querySelector('#h-del');
  if(delBtn) delBtn.onclick=()=>{
    showConfirm('¿Eliminar este horario? Se perderá su planificación.', ()=>{
      clase.horarios = clase.horarios.filter(x=>x.id!==h.id);
      if(state.activeGrupoId===h.id) state.activeGrupoId=null;
      scheduleSave(); overlay.remove(); render();
    });
  };

  overlay.querySelector('#h-save').onclick=()=>{
    h.dias = Array.from(overlay.querySelectorAll('.h-dia-check:checked')).map(el=>el.value);
    h.hora = overlay.querySelector('#h-hora').value;
    const aforoVal = overlay.querySelector('#h-aforo').value;
    h.aforoMaximo = aforoVal ? parseInt(aforoVal,10) : null;
    h.fechaInicio = overlay.querySelector('#h-fechaInicio').value;
    const idx=clase.horarios.findIndex(x=>x.id===h.id);
    if(idx===-1) clase.horarios.push(h); else clase.horarios[idx]=h;
    scheduleSave(); overlay.remove(); render();
  };
}

function grupoPlanificacionView(){
  const wrap=document.createElement('div');
  const DIA_ORDEN_PLAN = {'Lunes':1,'Martes':2,'Miércoles':3,'Jueves':4,'Viernes':5};
  const todosHorarios = state.grupos.flatMap(c=>c.horarios.map(h=>({clase:c, horario:h}))).sort((a,b)=>{
    if(a.clase.nombre!==b.clase.nombre) return a.clase.nombre.localeCompare(b.clase.nombre);
    const diaA = Math.min(...(a.horario.dias&&a.horario.dias.length?a.horario.dias.map(d=>DIA_ORDEN_PLAN[d]||99):[99]));
    const diaB = Math.min(...(b.horario.dias&&b.horario.dias.length?b.horario.dias.map(d=>DIA_ORDEN_PLAN[d]||99):[99]));
    if(diaA!==diaB) return diaA-diaB;
    return (a.horario.hora||'').localeCompare(b.horario.hora||'');
  });
  if(todosHorarios.length===0){
    wrap.innerHTML=`<div class="empty"><h3>Todavía no hay horarios configurados</h3><p>Ve a la pestaña "Clases" y añade un horario dentro de Funcional o Pilates para poder planificarlo aquí.</p></div>`;
    return wrap;
  }
  if(!state.activeGrupoId || !findHorario(state.activeGrupoId)){
    state.activeGrupoId = todosHorarios[0].horario.id;
  }
  const { clase, horario } = findHorario(state.activeGrupoId);

  const toolbar=document.createElement('div'); toolbar.className='session-toolbar';
  const select=document.createElement('select'); select.className='client-select';
  todosHorarios.forEach(({clase:c, horario:h})=>{
    const opt=document.createElement('option'); opt.value=h.id;
    opt.textContent = `${c.nombre} · ${(h.dias||[]).join(' y ')} ${h.hora}`;
    if(h.id===horario.id) opt.selected=true;
    select.appendChild(opt);
  });
  select.onchange=()=>{ state.activeGrupoId=select.value; render(); };
  toolbar.appendChild(select);
  const aforoPill=document.createElement('span'); aforoPill.className='pill';
  aforoPill.textContent = horario.aforoMaximo ? `${horario.inscritos.length}/${horario.aforoMaximo} plazas${horario.inscritos.length>horario.aforoMaximo?' (lista de espera)':''}` : `${horario.inscritos.length} inscritos`;
  toolbar.appendChild(aforoPill);
  wrap.appendChild(toolbar);

  const salaBox=document.createElement('details'); salaBox.style.marginBottom='14px';
  salaBox.innerHTML=`<summary style="cursor:pointer;color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;">Material disponible y reglas de sala</summary>
    <div style="margin-top:8px;font-size:13px;color:var(--ink-soft);line-height:1.5;">
      <p><strong style="color:var(--ink);">Material:</strong> ${SALA.materialDisponible}</p>
      <p><strong style="color:var(--ink);">Reglas:</strong></p>
      <ul style="margin:4px 0 0 18px;padding:0;">${SALA.reglas.map(r=>`<li>${r}</li>`).join('')}</ul>
    </div>`;
  wrap.appendChild(salaBox);

  if(typeof horario.notasGenerales!=='string') horario.notasGenerales='';
  const notasGenWrap=document.createElement('div'); notasGenWrap.className='field'; notasGenWrap.style.cssText='margin-bottom:14px;';
  notasGenWrap.innerHTML=`<label>📝 Anotaciones mías (libres, no se comparten con el grupo)</label>`;
  const notasGenTextarea=document.createElement('textarea');
  notasGenTextarea.placeholder='Observaciones personales sobre esta clase: dinámica del grupo, ideas para próximas semanas, cosas a vigilar...';
  notasGenTextarea.style.minHeight='60px';
  notasGenTextarea.value = horario.notasGenerales;
  notasGenTextarea.oninput=()=>{ horario.notasGenerales = notasGenTextarea.value; scheduleSave(); };
  notasGenWrap.appendChild(notasGenTextarea);
  wrap.appendChild(notasGenWrap);

  if(horario.weeks.length===0){
    const empty=document.createElement('div'); empty.className='empty';
    empty.innerHTML=`<h3>Sin plan todavía</h3><p>Crea la Semana 1 para este horario.</p>`;
    wrap.appendChild(empty);
  }

  if(horario.weeks.length>1){
    const jumpWrap=document.createElement('div'); jumpWrap.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:12px;';
    jumpWrap.innerHTML=`<label style="font-size:12px;color:var(--ink-soft);white-space:nowrap;">Ir directamente a:</label>`;
    const jumpSelect=document.createElement('select'); jumpSelect.style.cssText='max-width:220px;';
    jumpSelect.innerHTML = `<option value="">Elige una semana...</option>` + horario.weeks.map(w=>`<option value="${w.id||''}">Semana ${w.numero}</option>`).join('');
    jumpSelect.onchange=()=>{
      const target = horario.weeks.find(w=>w.id===jumpSelect.value);
      if(!target) return;
      semanasColapsadas.delete(target.id);
      render();
      setTimeout(()=>{
        const el = document.getElementById('semana-'+target.id);
        if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
      }, 60);
    };
    jumpWrap.appendChild(jumpSelect);
    wrap.appendChild(jumpWrap);
  }

  horario.weeks.forEach((week,wIdx)=>{

  wrap.appendChild(addWeekBtn);

      diaHeader.textContent = `Día ${item.diaSesion}`;
      body.appendChild(diaHeader);

    const itemColapsado = itemsColapsados.has(item.id);

    const poolBase = state.exercises.filter(ex=>clientesInscritos.every(c=>isExerciseSafeForClient(ex,c)));

  foot.appendChild(liveBtn);
  const exportBtn=document.createElement('button'); exportBtn.className='btn btn-sm btn-ghost'; exportBtn.textContent='📄 Exportar sesión';

  notesInput.oninput=()=>{ week.notas=notesInput.value; marcarModificada(week); scheduleSave(); };
  foot.appendChild(notesInput);

  const ratingBox=document.createElement('div');

  const media = mediaDificultadSemana(week.items);
  const mediaTxt = media===null ? 'sin datos' : media.toFixed(1)+'/3 '+DIFICULTAD_ICONOS[Math.round(media)-1];
  const leftInfo=document.createElement('div');
  leftInfo.innerHTML = `<strong style="color:var(--ink-soft);">Dificultad media (automática):</strong> ${mediaTxt}`;
  ratingBox.appendChild(leftInfo);

  ratingBox.appendChild(rightInfo);
  body.appendChild(ratingBox);
  block.appendChild(body);
  return block;
}

function generateRandomGroupWeek(clase, horario, week){
  if(state.exercises.length===0){
    showAlert('La batería de ejercicios está vacía. Añade ejercicios primero en la pestaña "Batería de ejercicios".');
    return;
  }
  const isRotativa = clase.tipo==='rotativa';

  const pedirDias = ()=>{
    const overlay=document.createElement('div'); overlay.className='overlay';
    overlay.innerHTML=`
      <div class="modal" style="max-width:400px;">
        <div class="modal-head"><h2>Generar semana aleatoria</h2><button class="close-x">✕</button></div>
        <div class="field"><label>¿Cuántos días distintos se imparte esta clase esta semana?</label><input type="number" id="rw-dias" value="1" min="1" max="6"></div>
        <p style="font-size:12px;color:var(--ink-soft);margin-top:-4px;">Se generará una sesión distinta (sin repetir ejercicios entre ellas) para cada día que indiques.</p>
        ${htmlFiltrosGeneracion()}
        <div class="actions" style="margin-top:14px;justify-content:flex-end;">
          <button class="btn btn-accent" id="rw-confirm">Generar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('.close-x').onclick=()=>overlay.remove();
    overlay.onclick=(e)=>{ if(e.target===overlay) overlay.remove(); };
    const filtrosCtrl = conectarFiltrosGeneracion(overlay);
    overlay.querySelector('#rw-confirm').onclick=()=>{
      const dias = Math.max(1, Math.min(6, parseInt(overlay.querySelector('#rw-dias').value)||1));
      const filtros = filtrosCtrl.leer();
      overlay.remove();
      doGenerate(dias, filtros);
    };
  };

  const doGenerate = (numDias, filtros)=>{
    // Filtra por precauciones de todos los inscritos que sean clientes con ficha (los invitados sin ficha no se pueden filtrar)
    const clientesInscritos = horario.inscritos.filter(i=>i.tipo==='cliente').map(i=>state.clients.find(c=>c.id===i.clienteId)).filter(Boolean);
    let pool = state.exercises.filter(ex=>clientesInscritos.every(c=>isExerciseSafeForClient(ex,c,filtros.nivel)));
    pool = aplicarFiltrosGeneracion(pool, filtros);
    if(pool.length===0){
      showAlert('Ningún ejercicio de la batería cumple los filtros elegidos y a la vez es seguro para las precauciones combinadas de los inscritos. Prueba a quitar algún filtro o añade ejercicios alternativos en la Batería.');
      return;
    }
    const usedElsewhere = new Set();
    horario.weeks.forEach(w=>{ if(w!==week) w.items.forEach(it=>usedElsewhere.add(it.exerciseId)); });
    let freshPool = pool.filter(ex=>!usedElsewhere.has(ex.id));
    const porDia = isRotativa?8:6;
    if(freshPool.length < porDia*numDias) freshPool = pool;

    const numEstaciones = 4;
    const repsOptions=['10','12','15']; const restOptions=['30s','45s','60s'];
    const usadosEnEstaSemana = new Set();
    const newItems = [];
    for(let dia=1; dia<=numDias; dia++){
      let disponibles = freshPool.filter(ex=>!usadosEnEstaSemana.has(ex.id));
      if(disponibles.length < porDia) disponibles = freshPool;
      const chosen = construirSesionPorPresupuesto(disponibles, {repsOptions, restOptions, equilibrarGrupos: filtros.grupos.length===0});
      chosen.forEach(c=>usadosEnEstaSemana.add(c.ex.id));
      chosen.forEach(({ex, series, reps, descanso}, i)=>{
        newItems.push({
          exerciseId: ex.id,
          diaSesion: numDias>1?dia:undefined,
          estacion: isRotativa ? `Estación ${(i % numEstaciones)+1}` : '',
          series, reps, carga:'', descanso, notas:''
        });
      });
    }
    week.items = newItems;
    scheduleSave(); render();
  };
  if(week.items.length>0){
    showConfirm('Esto sustituirá los ejercicios actuales de esta semana por una selección aleatoria. ¿Continuar?', pedirDias);
  } else { pedirDias(); }
}

function sesionesView(){

    return grupoPlanificacionView();
  }

  const scoped = screenClients();
  if(scoped.length===0){
    wrap.innerHTML = `<div class="empty"><h3>No hay clientes todavía</h3><p>Crea una ficha de cliente primero.</p></div>`;
    return wrap;
  }
  if(!state.activeClientId || !scoped.find(c=>c.id===state.activeClientId)){
    state.activeClientId = scoped[0].id;
  }
  const toolbar=document.createElement('div'); toolbar.className='session-toolbar';
  toolbar.style.flexWrap='wrap';
  const searchWrap=document.createElement('div'); searchWrap.style.cssText='width:100%;margin-bottom:6px;';
  const searchInput=document.createElement('input'); searchInput.className='search'; searchInput.placeholder='Buscar cliente por nombre...';
  searchWrap.appendChild(searchInput);

  crearAutocompleteCliente(searchInput, ()=>scoped, (cliente)=>{
    state.activeClientId = cliente.id;
    render();
  });
  const select=document.createElement('select'); select.className='client-select';
  const ordenados = [...scoped].sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  ordenados.forEach(c=>{

    if(c.id===state.activeClientId) opt.selected=true;
    select.appendChild(opt);
  });
  select.onchange=()=>{ state.activeClientId=select.value; render(); };
  toolbar.appendChild(select);
  const client = state.clients.find(c=>c.id===state.activeClientId);
  const unitClients = getUnitClients(client);
  const isPair = unitClients.length===2;

  if(isPair){
    const parejaPill=document.createElement('span'); parejaPill.className='pill'; parejaPill.textContent=`Plan conjunto: ${unitClients[0].nombre} & ${unitClients[1].nombre}`;
    toolbar.appendChild(parejaPill);
  } else {
    const pill=document.createElement('span'); pill.className='pill'; pill.textContent=`Evitar: ${client.salud.evitar || 'nada indicado'}`;
    toolbar.appendChild(pill);
  }
  wrap.appendChild(toolbar);

  const salaBox=document.createElement('details'); salaBox.style.marginBottom='14px';
  salaBox.innerHTML=`<summary style="cursor:pointer;color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;">Material disponible y reglas de sala</summary>
    <div style="margin-top:8px;font-size:13px;color:var(--ink-soft);line-height:1.5;">
      <p><strong style="color:var(--ink);">Material:</strong> ${SALA.materialDisponible}</p>
      <p><strong style="color:var(--ink);">Reglas:</strong></p>
      <ul style="margin:4px 0 0 18px;padding:0;">${SALA.reglas.map(r=>`<li>${r}</li>`).join('')}</ul>
    </div>`;
  wrap.appendChild(salaBox);

  if(isPair){
    unitClients.forEach((p,i)=>{
      if(!p.notas) return;
      const warn=document.createElement('div'); warn.className='warn-banner';
      warn.style.borderLeft = '3px solid '+(i===0?'var(--accent)':'var(--accent-b)');
      warn.textContent=`📌 ${p.nombre}: `+p.notas;
      wrap.appendChild(warn);
    });
  } else if(client.notas){
    const warn=document.createElement('div'); warn.className='warn-banner';
    warn.textContent='📌 Notas del entrenador: '+client.notas;
    wrap.appendChild(warn);
  }

  const key = unitKeyFor(client);
  if(!state.programs[key]) state.programs[key]={weeks:[]};
  const program = state.programs[key];
  if(typeof program.notasGenerales!=='string') program.notasGenerales='';

  const notasGenWrap=document.createElement('div'); notasGenWrap.className='field'; notasGenWrap.style.cssText='margin-bottom:14px;';
  notasGenWrap.innerHTML=`<label>📝 Anotaciones mías (libres, no se comparten con el cliente)</label>`;
  const notasGenTextarea=document.createElement('textarea');
  notasGenTextarea.placeholder='Observaciones personales sobre este cliente/pareja: cosas a vigilar, ideas para próximas semanas, impresiones de la sesión...';
  notasGenTextarea.style.minHeight='60px';
  notasGenTextarea.value = program.notasGenerales;
  notasGenTextarea.oninput=()=>{ program.notasGenerales = notasGenTextarea.value; scheduleSave(); };
  notasGenWrap.appendChild(notasGenTextarea);
  wrap.appendChild(notasGenWrap);

  const progresoWrap=document.createElement('div'); progresoWrap.style.cssText='margin-bottom:14px;';
  const progresoBtn=document.createElement('button'); progresoBtn.className='btn btn-sm'; progresoBtn.textContent='📈 Ver progreso';
  progresoBtn.onclick=()=>abrirModalProgreso(program, unitClients);
  progresoWrap.appendChild(progresoBtn);
  wrap.appendChild(progresoWrap);

  if(program.weeks.length===0){
    const empty=document.createElement('div'); empty.className='empty';
    empty.innerHTML=`<h3>Sin plan todavía</h3><p>Crea la Semana 1 para empezar el programa de 4 semanas.${isPair?' Este plan es compartido: se aplicará a ambos miembros de la pareja.':''}</p></div>`;
    wrap.appendChild(empty);
  }

  if(program.weeks.length>1){
    const jumpWrap=document.createElement('div'); jumpWrap.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:12px;';
    jumpWrap.innerHTML=`<label style="font-size:12px;color:var(--ink-soft);white-space:nowrap;">Ir directamente a:</label>`;
    const jumpSelect=document.createElement('select'); jumpSelect.style.cssText='max-width:220px;';
    jumpSelect.innerHTML = `<option value="">Elige una semana...</option>` + program.weeks.map(w=>`<option value="${w.id||''}">Semana ${w.numero}</option>`).join('');
    jumpSelect.onchange=()=>{
      const target = program.weeks.find(w=>w.id===jumpSelect.value);
      if(!target) return;
      semanasColapsadas.delete(target.id);
      render();
      setTimeout(()=>{
        const el = document.getElementById('semana-'+target.id);
        if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
      }, 60);
    };
    jumpWrap.appendChild(jumpSelect);
    wrap.appendChild(jumpWrap);
  }

  program.weeks.forEach((week,wIdx)=>{
    if(!week.id) week.id = uid();
    const bloque = weekBlock(unitClients, program, week, wIdx);
    bloque.id = 'semana-'+week.id;
    wrap.appendChild(bloque);
  });

  const addWeekBtn=document.createElement('button');
  addWeekBtn.className='btn btn-accent'; addWeekBtn.style.marginTop='6px';
  addWeekBtn.textContent='+ Añadir semana '+(program.weeks.length+1);
  addWeekBtn.onclick=()=>{
    program.weeks.push({numero:program.weeks.length+1, notas:'', items:[]});
    scheduleSave(); render();
  };
  wrap.appendChild(addWeekBtn);

  return wrap;
}

const SUPERSET_COLORES = ['#9D4FD1','#2E90D9','#E0902E','#3FAF7F','#F08069'];
function colorSuperset(supersetId, week){
  const ids = [...new Set(week.items.map(it=>it.supersetId).filter(Boolean))];
  const idx = ids.indexOf(supersetId);
  return SUPERSET_COLORES[idx % SUPERSET_COLORES.length];
}
function letraSuperset(supersetId, week){
  const ids = [...new Set(week.items.map(it=>it.supersetId).filter(Boolean))];
  const idx = ids.indexOf(supersetId);
  return String.fromCharCode(65+idx); // A, B, C...
}
function fondoSuperset(supersetId, week){
  const hex = colorSuperset(supersetId, week);
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},0.14)`;
}
function badgeSuperset(supersetId, week){
  const color = colorSuperset(supersetId, week);
  return `<span style="background:${color};color:#fff;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.02em;margin-left:8px;white-space:nowrap;">🔗 SUPERSERIE ${letraSuperset(supersetId,week)}</span>`;
}
// ¿El elemento anterior de la lista pertenece a la misma superserie? (para fusionar visualmente las filas, sin separación entre ellas)
function esContinuacionDeSuperset(items, idx){
  if(idx<=0) return false;
  const actual = items[idx], anterior = items[idx-1];
  return !!(actual.supersetId && anterior.supersetId===actual.supersetId);
}

function abrirModalProgreso(program, unitClients){
  const isPair = unitClients.length===2;
  const overlay=document.createElement('div'); overlay.className='overlay';
  // Recopila qué ejercicios tienen algún dato numérico de carga registrado en alguna semana
  const ejerciciosConDatos = new Map(); // exerciseId -> nombre
  program.weeks.forEach(week=>{
    week.items.forEach(item=>{
      const tieneCarga = isPair
        ? ((item.a && !isNaN(parseFloat(item.a.carga))) || (item.b && !isNaN(parseFloat(item.b.carga))))
        : !isNaN(parseFloat(item.carga));
      if(tieneCarga){
        const ex = state.exercises.find(e=>e.id===item.exerciseId);
        ejerciciosConDatos.set(item.exerciseId, ex?ex.nombre:'(ejercicio eliminado)');
      }
    });
  });
  overlay.innerHTML=`
    <div class="modal" style="max-width:560px;">
      <div class="modal-head"><h2>Progreso del cliente</h2><button class="close-x">✕</button></div>
      ${ejerciciosConDatos.size===0
        ? `<p style="color:var(--ink-soft);font-size:13px;">Todavía no hay ninguna carga numérica (p.ej. "12kg") guardada en el campo "Carga" de ningún ejercicio de este plan. Anota el peso que se vaya usando cada semana ahí mismo para poder ver la evolución aquí.</p>`
        : `<div class="field"><label>Elige un ejercicio</label><select id="prog-ex">${[...ejerciciosConDatos.entries()].map(([id,nombre])=>`<option value="${id}">${escapeHtml(nombre)}</option>`).join('')}</select></div>
           <div id="prog-chart-area" style="margin-top:14px;"></div>`
      }
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.close-x').onclick=()=>overlay.remove();
  overlay.onclick=(e)=>{ if(e.target===overlay) overlay.remove(); };
  if(ejerciciosConDatos.size===0) return;

  function dibujarGrafico(exerciseId){
    const area = overlay.querySelector('#prog-chart-area');
    const puntos = [];
    program.weeks.forEach(week=>{
      const item = week.items.find(it=>it.exerciseId===exerciseId);
      if(!item) return;
      if(isPair){
        const pesoA = parseFloat(item.a && item.a.carga); const pesoB = parseFloat(item.b && item.b.carga);
        if(!isNaN(pesoA)) puntos.push({semana:week.numero, peso:pesoA, quien:unitClients[0].nombre});
        if(!isNaN(pesoB)) puntos.push({semana:week.numero, peso:pesoB, quien:unitClients[1].nombre});
      } else {
        const peso = parseFloat(item.carga);
        if(!isNaN(peso)) puntos.push({semana:week.numero, peso, quien:null});
      }
    });
    if(puntos.length===0){
      area.innerHTML = `<p style="color:var(--ink-soft);font-size:13px;">No hay valores numéricos de peso guardados para este ejercicio todavía (revisa que el campo "peso" tenga un número).</p>`;
      return;
    }
    const w=460, h=200, pad=36;
    const semanas = [...new Set(puntos.map(p=>p.semana))].sort((a,b)=>a-b);
    const pesos = puntos.map(p=>p.peso);
    const minP = Math.min(...pesos), maxP = Math.max(...pesos);
    const rango = maxP-minP || 1;
    const xFor = (semana)=> pad + (semanas.indexOf(semana)/(Math.max(semanas.length-1,1))) * (w-2*pad);
    const yFor = (peso)=> h-pad - ((peso-minP)/rango) * (h-2*pad);
    function lineaDe(quien, color){
      const pts = puntos.filter(p=>p.quien===quien).sort((a,b)=>a.semana-b.semana);
      if(pts.length===0) return '';
      const path = pts.map((p,i)=>`${i===0?'M':'L'}${xFor(p.semana)},${yFor(p.peso)}`).join(' ');
      const circles = pts.map(p=>`<circle cx="${xFor(p.semana)}" cy="${yFor(p.peso)}" r="4" fill="${color}"></circle><text x="${xFor(p.semana)}" y="${yFor(p.peso)-10}" font-size="10" fill="var(--ink)" text-anchor="middle">${p.peso}</text>`).join('');
      return `<path d="${path}" fill="none" stroke="${color}" stroke-width="2"></path>${circles}`;
    }
    const quienes = isPair ? [[unitClients[0].nombre,'#9D4FD1'],[unitClients[1].nombre,'#2E90D9']] : [[null,'#9D4FD1']];
    const svgLineas = quienes.map(([q,c])=>lineaDe(q,c)).join('');
    const ejeX = semanas.map(s=>`<text x="${xFor(s)}" y="${h-8}" font-size="10" fill="var(--ink-soft)" text-anchor="middle">S${s}</text>`).join('');
    area.innerHTML = `
      <svg width="100%" viewBox="0 0 ${w} ${h}" style="background:var(--surface);border-radius:8px;">
        <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)"></line>
        ${svgLineas}
        ${ejeX}
      </svg>
      ${isPair?`<div style="display:flex;gap:14px;margin-top:6px;font-size:11.5px;"><span style="color:#9D4FD1;">● ${escapeHtml(unitClients[0].nombre)}</span><span style="color:#2E90D9;">● ${escapeHtml(unitClients[1].nombre)}</span></div>`:''}
    `;
  }
  const select = overlay.querySelector('#prog-ex');
  dibujarGrafico(select.value);
  select.onchange=()=>dibujarGrafico(select.value);
}

let sesionDirectaInterval = null;
function abrirSesionEnDirecto(week, unitClients){
  if(week.items.length===0){ showAlert('Esta semana todavía no tiene ejercicios añadidos.'); return; }
  const isPair = unitClients && unitClients.length===2;

  overlay.style.zIndex='500';
  const modal=document.createElement('div'); modal.className='modal'; modal.style.cssText='max-width:520px;text-align:center;';
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  function limpiarIntervalo(){ if(sesionDirectaInterval){ clearInterval(sesionDirectaInterval); sesionDirectaInterval=null; } }
  function cerrar(){ limpiarIntervalo(); overlay.remove(); }
  overlay.onclick=(e)=>{ if(e.target===overlay) cerrar(); };

  function siguienteEsMismaSuperserie(){
    const actual = week.items[idx];
    const siguiente = week.items[idx+1];
    return !!(actual && siguiente && actual.supersetId && actual.supersetId===siguiente.supersetId);
  }

  function pintar(){
    limpiarIntervalo();
    const item = week.items[idx];
    const ex = state.exercises.find(e=>e.id===item.exerciseId);
    const enSuperserie = !!item.supersetId;
    const esUltimaDeSuperserie = enSuperserie && !siguienteEsMismaSuperserie();

    let datosHtml = '';
    if(isPair){
      const slots = item.soloPara ? [item.soloPara] : ['a','b'];
      datosHtml = `<div style="display:flex;gap:20px;justify-content:center;margin:14px 0;">
        ${slots.map(slot=>{ const pi = slot==='a'?0:1; return `
          <div style="text-align:left;">
            <div style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;margin-bottom:4px;">${escapeHtml(unitClients[pi].nombre)}</div>
            <div style="font-size:13.5px;">Series: <strong>${escapeHtml(item[slot].series||'-')}</strong> · Reps: <strong>${escapeHtml(item[slot].reps||'-')}</strong></div>
            <div style="font-size:13.5px;">Carga: <strong>${escapeHtml(item[slot].carga||'-')}</strong> · Descanso: <strong>${escapeHtml(item[slot].descanso||'-')}</strong></div>
          </div>
        `; }).join('')}
      </div>`;
    } else {
      datosHtml = `<div style="font-size:15px;margin:14px 0;">Series: <strong>${escapeHtml(item.series||'-')}</strong> &nbsp;·&nbsp; Reps: <strong>${escapeHtml(item.reps||'-')}</strong> &nbsp;·&nbsp; Carga: <strong>${escapeHtml(item.carga||'-')}</strong></div>`;
    }
    const descansoSeg = isPair ? (parseInt((item.soloPara?item[item.soloPara]:item.a).descanso)||parseInt(item.b&&item.b.descanso)||30) : (parseInt(item.descanso)||30);

    modal.innerHTML=`
      <div class="modal-head" style="justify-content:center;"><button class="close-x" id="sd-cerrar" style="position:absolute;right:20px;">✕</button></div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;">Ejercicio ${idx+1} de ${week.items.length}${enSuperserie?` · Superserie ${letraSuperset(item.supersetId,week)}`:''}</div>
      <h2 style="margin:10px 0 4px;">${ex?escapeHtml(ex.nombre):'(ejercicio eliminado)'}</h2>
      ${ex?htmlImagenEjercicio(ex,'sd-img'):''}
      ${datosHtml}
      ${ex&&ex.descripcion?`<p style="font-size:12.5px;color:var(--ink-soft);">${escapeHtml(ex.descripcion)}</p>`:''}
      <div id="sd-timer-area" style="margin:16px 0;"></div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:10px;">
        <button class="btn btn-ghost" id="sd-anterior" ${idx===0?'disabled':''}>◀ Anterior</button>
        <button class="btn btn-accent" id="sd-siguiente">${idx===week.items.length-1?'Terminar ✔':'Siguiente ▶'}</button>
      </div>
    `;
    modal.querySelector('#sd-cerrar').onclick=cerrar;
    modal.querySelector('#sd-anterior').onclick=()=>{ if(idx>0){ idx--; pintar(); } };
    modal.querySelector('#sd-siguiente').onclick=()=>{
      if(idx<week.items.length-1){ idx++; pintar(); } else { cerrar(); }
    };

    const timerArea = modal.querySelector('#sd-timer-area');
    if(enSuperserie && !esUltimaDeSuperserie){
      timerArea.innerHTML = `<div style="font-size:12.5px;color:var(--accent);">🔗 Superserie: pasa directamente al siguiente ejercicio, sin descanso.</div>`;
    } else {
      const btnDescanso=document.createElement('button');
      btnDescanso.className='btn btn-sm';
      btnDescanso.textContent=`⏱ Iniciar descanso (${descansoSeg}s)`;
      timerArea.appendChild(btnDescanso);
      const cuenta=document.createElement('div');
      cuenta.style.cssText='font-family:\'IBM Plex Mono\',monospace;font-size:36px;font-weight:700;margin-top:8px;';
      timerArea.appendChild(cuenta);
      btnDescanso.onclick=()=>{
        btnDescanso.disabled=true;
        let restante=descansoSeg;
        cuenta.textContent = restante+'s';
        pitido(660,200);
        sesionDirectaInterval=setInterval(()=>{
          restante--;
          if(restante<=3 && restante>0) pitido(660,120);
          if(restante<=0){
            cuenta.textContent='¡Listo!';
            pitido(880,400);
            clearInterval(sesionDirectaInterval); sesionDirectaInterval=null;
            return;
          }
          cuenta.textContent = restante+'s';
        }, 1000);
      };
    }
  }
  pintar();
}

function abrirModalSuperseries(week){
  const overlay=document.createElement('div'); overlay.className='overlay';
  const nombreDeItem = (item)=>{
    const ex = state.exercises.find(e=>e.id===item.exerciseId);
    return ex ? ex.nombre : '(ejercicio eliminado)';
  };
  overlay.innerHTML=`
    <div class="modal" style="max-width:480px;">
      <div class="modal-head"><h2>Superseries de esta semana</h2><button class="close-x">✕</button></div>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-top:0;">Selecciona 2 o más ejercicios para agruparlos en una superserie (se hacen seguidos, sin descanso entre ellos). Los ejercicios ya agrupados se muestran con su color.</p>
      <div id="ss-lista" style="display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto;"></div>
      <div class="actions" style="margin-top:16px;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <button class="btn btn-sm btn-danger" id="ss-disolver">Disolver selección</button>
        <button class="btn btn-accent" id="ss-agrupar">Agrupar seleccionados</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.close-x').onclick=()=>{ overlay.remove(); render(); };
  overlay.onclick=(e)=>{ if(e.target===overlay){ overlay.remove(); render(); } };
  const lista = overlay.querySelector('#ss-lista');
  week.items.forEach((item,idx)=>{
    const row=document.createElement('label');
    const color = item.supersetId ? colorSuperset(item.supersetId, week) : 'var(--line)';
    row.style.cssText=`display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;border-left:4px solid ${color};background:var(--surface);cursor:pointer;font-size:13px;`;
    row.innerHTML=`<input type="checkbox" data-idx="${idx}" style="width:auto;"> <span>${escapeHtml(nombreDeItem(item))}${item.supersetId?` <span style="color:var(--ink-soft);font-size:11px;">— Superserie ${letraSuperset(item.supersetId, week)}</span>`:''}</span>`;
    lista.appendChild(row);
  });
  overlay.querySelector('#ss-agrupar').onclick=()=>{
    const idxs = [...overlay.querySelectorAll('input[type=checkbox]:checked')].map(c=>parseInt(c.dataset.idx)).sort((a,b)=>a-b);
    if(idxs.length<2){ showAlert('Selecciona al menos 2 ejercicios para formar una superserie.'); return; }
    const nuevoId = uid();
    idxs.forEach((i,pos)=>{
      const item = week.items[i];
      item.supersetId = nuevoId;
      const esUltimo = pos===idxs.length-1;
      const descansoIntermedio = esUltimo ? undefined : '0s'; // sin descanso entre ejercicios de la misma superserie, salvo el último
      if(descansoIntermedio!==undefined){
        if(item.a && item.b){ item.a.descanso = descansoIntermedio; item.b.descanso = descansoIntermedio; }
        else { item.descanso = descansoIntermedio; }
      }
    });
    scheduleSave(); overlay.remove(); render();
  };
  overlay.querySelector('#ss-disolver').onclick=()=>{
    const idxs = [...overlay.querySelectorAll('input[type=checkbox]:checked')].map(c=>parseInt(c.dataset.idx));
    if(idxs.length===0){ showAlert('Selecciona los ejercicios cuya superserie quieras disolver.'); return; }
    idxs.forEach(i=>{ delete week.items[i].supersetId; });
    scheduleSave(); overlay.remove(); render();
  };
}

// Buscador/filtro de ejercicios reutilizable, para los cuadros de "Añadir ejercicio" (personal y grupos)
function htmlBuscadorEjercicio(){
  const gruposUnicos = ['Tren superior','Tren inferior', ...new Set(state.exercises.map(e=>e.grupoMuscular).filter(Boolean))].filter((v,i,a)=>a.indexOf(v)===i);
  const materialesUnicos = [...new Set(state.exercises.flatMap(e=>(e.material||'').split(',').map(m=>m.trim()).filter(Boolean)))].sort((a,b)=>a.localeCompare(b,'es'));
  return `
    <div class="field"><label>Buscar ejercicio por nombre</label><input id="pick-buscar" placeholder="Escribe para filtrar..."></div>
    <div class="field-row">
      <div class="field"><label>Grupo muscular</label>
        <select id="pick-filtro-grupo"><option value="">Todos</option>${gruposUnicos.map(g=>`<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Material</label>
        <select id="pick-filtro-material"><option value="">Todo</option>${materialesUnicos.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field"><label>Ejercicio de la batería (👥 pareja · 👪 dinámica de grupo) — <span id="pick-contador" style="text-transform:none;font-weight:400;"></span></label>
      <select id="pick-ex" size="6" style="height:auto;"></select>
    </div>
  `;
}
function conectarBuscadorEjercicio(overlay){
  const buscar = overlay.querySelector('#pick-buscar');
  const filtroGrupo = overlay.querySelector('#pick-filtro-grupo');
  const filtroMaterial = overlay.querySelector('#pick-filtro-material');
  const select = overlay.querySelector('#pick-ex');
  const contador = overlay.querySelector('#pick-contador');
  function actualizar(){
    const q = normalizarBusqueda(buscar.value.trim());
    const grupo = filtroGrupo.value;
    const material = filtroMaterial.value;
    const filtrados = state.exercises.filter(e=>{
      const coincideNombre = !q || normalizarBusqueda(e.nombre).includes(q);
      const coincideGrupo = !grupo || grupoMuscularCoincideConFiltro(e.grupoMuscular, grupo);
      const coincideMaterial = !material || (e.material||'').split(',').map(m=>m.trim()).includes(material);
      return coincideNombre && coincideGrupo && coincideMaterial;
    });
    const valorPrevio = select.value;
    select.innerHTML = filtrados.map(e=>`<option value="${e.id}" data-pareja="${e.esPareja?'1':'0'}">${e.esPareja?'👥 ':''}${e.esDinamicaGrupal?'👪 ':''}${escapeHtml(e.nombre)} — ${escapeHtml(e.grupoMuscular||'')}</option>`).join('');
    if(filtrados.some(e=>e.id===valorPrevio)) select.value = valorPrevio;
    contador.textContent = `${filtrados.length} resultado${filtrados.length===1?'':'s'}`;
    select.dispatchEvent(new Event('change'));
  }
  buscar.addEventListener('input', actualizar);
  filtroGrupo.addEventListener('change', actualizar);
  filtroMaterial.addEventListener('change', actualizar);
  actualizar();
}
// Interruptor "Repeticiones / Tiempo" para el campo de reps al añadir un ejercicio
function conectarToggleMedida(overlay, sufijos){
  const botones = overlay.querySelectorAll('.toggle-medida');
  function idPara(base, suf){ return suf ? `${base}-${suf}` : base; }
  function aplicar(modo){
    botones.forEach(b=>{
      const activo = b.dataset.val===modo;
      b.classList.toggle('btn-accent', activo);
    });
    sufijos.forEach(suf=>{
      const input = overlay.querySelector('#'+idPara('pick-reps', suf));
      const label = overlay.querySelector('#'+idPara('pick-reps-label', suf));
      if(!input) return;
      if(modo==='tiempo'){
        if(label) label.textContent = 'Tiempo';
        if(input.value==='12'||input.value==='') input.value = '30s';
        input.placeholder = 'p.ej. 30s / 1 min';
      } else {
        if(label) label.textContent = 'Reps';
        if(input.value==='30s') input.value = '12';
        input.placeholder = '';
      }
    });
  }
  botones.forEach(b=>{ b.onclick=(e)=>{ e.preventDefault(); aplicar(b.dataset.val); }; });
  aplicar('reps');
}

function materialNecesarioDeItems(items){
