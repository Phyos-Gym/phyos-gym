<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#181420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<title>Phyos Gym</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#181420;
  --surface:#211A2E;
  --surface-2:#2B2240;
  --ink:#F5F2F8;
  --ink-soft:#A79FB8;
  --accent:#FF6B35;
  --accent-dark:#E85A28;
  --accent-2:#FFB347;
  --accent-b:#9B6DFF;
  --accent-b-dark:#7B4FDB;
  --line:#382C4A;
  --danger:#F0555A;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;color-scheme:dark;}
h1,h2,h3,h4{font-family:'Manrope',sans-serif;font-weight:800;letter-spacing:-.01em;margin:0;color:var(--ink);}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
input,textarea,select{font-family:'Inter',sans-serif;}

#app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

.header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;border-bottom:2px solid var(--accent);padding-bottom:14px;}
.header .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);}
.header h1{font-size:30px;color:var(--ink);}
.header .sub{font-size:12px;color:var(--ink-soft);text-align:right;}

.tabs{display:flex;gap:6px;margin-bottom:24px;}
.tab{position:relative;padding:10px 18px 12px;background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--ink-soft);top:2px;}
.tab.active{color:var(--accent);border-color:var(--line);background:var(--surface-2);top:0;box-shadow:0 -2px 0 var(--accent) inset;}
.tab-panel{border-top:2px solid var(--line);padding-top:20px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}

.card{background:rgba(255,255,255,.05);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px;position:relative;transition:box-shadow .15s,border-color .15s,transform .15s;}
.card:hover{transform:translateY(-2px);}
.card:hover{box-shadow:0 4px 18px rgba(203,158,234,.12);border-color:var(--accent-dark);}
.card .tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:rgba(203,158,234,.14);padding:2px 7px;border-radius:4px;margin-bottom:8px;}
.card h3{font-size:17px;margin-bottom:4px;color:var(--ink);}
.card p{font-size:13px;color:var(--ink-soft);margin:2px 0;line-height:1.4;}
.card p strong{color:var(--ink);}
.card .tag.tag-inactive{background:rgba(240,128,105,.16);color:var(--danger);margin-left:6px;}
.card.inactive{opacity:.55;border:1px solid var(--danger);}
.card.inactive:hover{opacity:.85;}
.card .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}

.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:7px 13px;border-radius:6px;font-size:12.5px;font-weight:600;}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#1D1224;}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#1D1224;}
.btn-accent:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;}
.btn-danger{border-color:var(--danger);color:var(--danger);background:transparent;}
.btn-danger:hover{background:var(--danger);color:#1D1224;}
.btn-sm{padding:4px 9px;font-size:11.5px;}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-soft);}
.btn-ghost:hover{background:var(--line);color:var(--ink);}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.search{padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;min-width:220px;background:var(--surface);color:var(--ink);}
.search::placeholder{color:var(--ink-soft);}

.overlay{position:fixed;inset:0;background:rgba(8,5,12,.7);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto;z-index:50;}
.modal{background:var(--surface);border-radius:12px;max-width:720px;width:100%;max-height:calc(100vh - 48px);overflow-y:auto;padding:26px 28px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.45);}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.close-x{border:none;background:none;font-size:20px;color:var(--ink-soft);cursor:pointer;line-height:1;}
.close-x:hover{color:var(--accent);}

.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.field-row.full{grid-template-columns:1fr;}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;margin-bottom:1px;}
.field input,.field textarea,.field select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;background:var(--bg);color:var(--ink);}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px;}
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(0.8);cursor:pointer;}
.field textarea{resize:vertical;min-height:44px;max-height:220px;overflow-y:auto;}
.field input[type="file"]{padding:6px 8px;font-size:11.5px;max-width:100%;color:var(--ink-soft);}
.field input[type="file"]::file-selector-button{font-size:11px;padding:5px 9px;border-radius:5px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;margin-right:8px;}
.field-group-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:16px 0 8px;border-top:1px dashed var(--line);padding-top:14px;}

.empty{border:1.5px dashed var(--line);border-radius:10px;padding:34px 20px;text-align:center;color:var(--ink-soft);}
.empty h3{color:var(--ink-soft);margin-bottom:6px;}

/* Exercise cards */
.ex-img-wrap{position:relative;width:100%;height:130px;margin-bottom:10px;}
.ex-img-wrap .ex-img-placeholder{position:absolute;inset:0;margin-bottom:0;}
.ex-card img{width:100%;height:130px;object-fit:cover;border-radius:6px;background:var(--surface-2);position:absolute;top:0;left:0;z-index:2;}
.ex-img-placeholder{width:100%;height:130px;border-radius:6px;margin-bottom:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:26px;color:var(--ink-soft);opacity:.55;}
.info-ejercicio-img{width:100%;max-height:260px;object-fit:cover;border-radius:8px;margin-bottom:12px;background:var(--surface-2);}
.t-lista-thumb{width:40px;height:40px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--surface-2);}
.t-actual-img{max-height:150px;border-radius:10px;margin-bottom:8px;object-fit:cover;background:var(--surface-2);}
.sd-img{max-height:180px;border-radius:10px;margin:8px 0;background:var(--surface-2);}
.ex-img-placeholder span{font-size:10.5px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.05em;}
.ex-card .precaucion{background:rgba(240,128,105,.14);border:1px solid rgba(240,128,105,.4);color:var(--danger);font-size:11.5px;padding:6px 8px;border-radius:6px;margin-top:8px;}

/* Sessions view */
.session-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
.week-block{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden;}
.week-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface-2);}
.week-head h3{font-size:15px;color:var(--accent);}
.ex-row{display:grid;grid-template-columns:1.3fr .5fr .5fr .7fr .5fr .6fr 1fr auto;gap:8px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);font-size:13px;}
.ex-row.header-row{background:var(--surface-2);font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600;}
.ex-row.header-row>div:not(:first-child),.pair-cols-head>div:not(:first-child){text-align:center;}
.ex-row input{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;background:var(--bg);color:var(--ink);}
.ex-row .exname{font-weight:600;font-family:'Inter';display:flex;align-items:center;gap:8px;color:var(--ink);}
.ex-row .exname img{width:32px;height:32px;object-fit:cover;border-radius:5px;flex-shrink:0;}
.week-foot{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);flex-wrap:wrap;gap:8px;}
.warn-banner{background:rgba(232,178,78,.12);border:1px solid rgba(232,178,78,.4);color:var(--accent-2);padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;}
select.client-select{padding:9px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:'Fraunces',serif;font-weight:600;background:var(--surface);color:var(--ink);}
.pill{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink-soft);}

/* Paired plans */
.pair-item{border-top:1px solid var(--line);padding:9px 16px 12px;}
.pair-item-head{display:flex;align-items:center;gap:8px;padding:2px 0 7px;}
.pair-item-head .exname{font-weight:600;display:flex;align-items:center;gap:8px;color:var(--ink);}
.pair-item-head .exname img{width:28px;height:28px;object-fit:cover;border-radius:5px;}
.pair-badge{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:20px;background:rgba(203,158,234,.16);color:var(--accent);}
.person-row{display:grid;grid-template-columns:110px .5fr .5fr .7fr .5fr .6fr 1fr auto;gap:8px;align-items:center;padding:4px 0 4px 10px;border-left:3px solid var(--accent);margin-bottom:3px;box-sizing:border-box;}
.person-row.person-b{border-left-color:var(--accent-b);}
.person-row .person-name{font-size:11.5px;font-weight:600;color:var(--accent);}
.person-row.person-b .person-name{color:var(--accent-b);}
.person-row input{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;background:var(--bg);color:var(--ink);}
.person-row input[data-f="notas"]{font-family:'Inter';}
.pair-cols-head{display:grid;grid-template-columns:110px .5fr .5fr .7fr .5fr .6fr 1fr auto;gap:8px;padding:0 16px 4px 26px;border-left:3px solid transparent;box-sizing:border-box;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
</style>

<script>
const STORAGE_KEY = 'app-data-v1';

// Dentro de Claude usamos el almacenamiento persistente del artefacto (sincroniza entre dispositivos con tu cuenta).
// Si el archivo se abre fuera de Claude (descargado y abierto directamente en el navegador), no existe window.storage,
// así que usamos localStorage como respaldo: los cambios se guardan, pero solo en ESTE navegador/dispositivo, sin sincronizar.
const usandoAlmacenamientoClaude = (typeof window.storage !== 'undefined' && window.storage !== null);
const storageBackend = usandoAlmacenamientoClaude ? window.storage : {
  async get(key){
    const raw = localStorage.getItem(key);
    if(raw===null) throw new Error('not found');
    return { key, value: raw };
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return { key, value };
  }
};

function uid(){ return Math.random().toString(36).slice(2,10); }

function unitKeyFor(client){
  if(client.pareja){
    return 'pair::' + [client.nombre, client.pareja].map(n=>n.trim().toLowerCase()).sort().join('::');
  }
  return 'solo::' + client.id;
}
function getUnitClients(client){
  if(client.pareja){
    const partner = state.clients.find(c=>c.nombre===client.pareja);
    return partner ? [client, partner] : [client];
  }
  return [client];
}

// ---------- Programación de altas/bajas automáticas ----------
// IMPORTANTE: usamos componentes de fecha LOCAL (no toISOString, que convierte a UTC y
// desplaza la fecha un día hacia atrás en husos horarios como España, UTC+1/+2).
function fechaLocalStr(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return fechaLocalStr(new Date()); }
function nextBusinessDay(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay(); // 0=domingo, 6=sábado
  if(day===6) d.setDate(d.getDate()+2);
  else if(day===0) d.setDate(d.getDate()+1);
  return fechaLocalStr(d);
}
function daysUntil(dateStr){
  const target = new Date(dateStr+'T00:00:00');
  const today = new Date(todayStr()+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function applyAutoScheduling(){
  const today = todayStr();
  state.clients.forEach(c=>{
    if(c.fechaInicio && c.pendienteInicio){
      const effStart = nextBusinessDay(c.fechaInicio);
      if(today >= effStart){
        c.activo = true; c.pendienteInicio = false;
      } else {
        c.activo = false;
      }
    }
    if(c.pausaFin){
      const effFin = nextBusinessDay(c.pausaFin);
      const effIni = c.pausaInicio ? nextBusinessDay(c.pausaInicio) : null;
      const pausaYaEmpezada = !effIni || today >= effIni;
      if(today >= effFin){
        // La pausa ya terminó: reactiva y limpia la programación para no repetirla
        c.activo = true; c.pausaInicio=''; c.pausaFin='';
      } else if(pausaYaEmpezada){
        c.activo = false;
      }
    } else if(c.pausaInicio){
      // Baja permanente sin fecha de vuelta: se desactiva a partir de esa fecha y no se reactiva sola
      const effIni = nextBusinessDay(c.pausaInicio);
      if(today >= effIni) c.activo = false;
    }
  });
  syncHorarioConInactivos();
  limpiarFranjasVacias();
}
function esOficinaOVacio(valor){
  const v=(valor||'').trim().toLowerCase();
  return !v || v==='oficina';
}
// Norma: una franja horaria personalizada (fuera de las horas base) solo se mantiene si tiene un motivo real (no Oficina/vacío)
function limpiarFranjasVacias(){
  if(!state.horario) return;
  state.horario.horas = state.horario.horas.filter(hora=>{
    if(HORAS_BASE.includes(hora)) return true; // las horas base siempre se conservan aunque estén vacías
    const diasUsados = state.horario.dias.some(dia=>(state.horario.grid[dia+'|'+hora]||'').trim());
    const excepcionesUsadas = Object.keys(state.horario.excepciones).some(k=>k.endsWith('|'+hora) && (state.horario.excepciones[k]||'').trim());
    const reservada = (state.horario.franjasReservadas||[]).some(r=>r.endsWith('|'+hora));
    return diasUsados || excepcionesUsadas || reservada;
  });
}
// Norma: cuando un cliente queda inactivo, su hueco en el horario pasa a "Oficina" automáticamente.
function syncHorarioConInactivos(){
  if(!state.horario) return;
  const inactivos = state.clients.filter(c=>c.activo===false);
  if(inactivos.length===0) return;
  const conteoPrimerNombre = {};
  state.clients.forEach(c=>{
    const primero = c.nombre.split(' ')[0].toLowerCase();
    conteoPrimerNombre[primero] = (conteoPrimerNombre[primero]||0)+1;
  });
  // Si el primer nombre lo comparte más de un cliente (p.ej. "Pilar Cloux" y "Pilar Pérez", o "Benito Muñoz" y "Benito Balado"),
  // usamos el nombre completo para no confundirlos entre sí. Si es único, seguimos usando solo el primer nombre,
  // porque así detectamos también entradas combinadas de pareja como "Alba y Nacho".
  const terminos = inactivos.map(c=>{
    const primero = c.nombre.split(' ')[0].toLowerCase();
    return conteoPrimerNombre[primero]>1 ? c.nombre.toLowerCase() : primero;
  });
  const forzadas = new Set(state.horario.franjasForzadas||[]);
  const reemplazar = (obj, tipoClave)=>{
    Object.keys(obj).forEach(key=>{
      const claveForzada = tipoClave==='grid' ? `GRID|${key}` : key;
      if(forzadas.has(claveForzada)) return; // el entrenador confirmó a propósito que se muestre aquí
      const val = (obj[key]||'').toLowerCase();
      if(!val || val==='oficina') return;
      if(terminos.some(t=>t && val.includes(t))) obj[key]='Oficina';
    });
  };
  reemplazar(state.horario.grid, 'grid');
  reemplazar(state.horario.excepciones, 'excepcion');
}
// ¿El texto que se va a guardar coincide con un cliente actualmente inactivo (incluye "pendiente de inicio")?
// Devuelve el cliente si hay coincidencia, o null si no.
function clienteInactivoQueCoincide(texto){
  const val = textoLimpio(texto||'').toLowerCase();
  if(!val) return null;
  const inactivos = state.clients.filter(c=>c.activo===false);
  const conteoPrimerNombre = {};
  state.clients.forEach(c=>{
    const primero = c.nombre.split(' ')[0].toLowerCase();
    conteoPrimerNombre[primero] = (conteoPrimerNombre[primero]||0)+1;
  });
  for(const c of inactivos){
    const primero = c.nombre.split(' ')[0].toLowerCase();
    const termino = conteoPrimerNombre[primero]>1 ? c.nombre.toLowerCase() : primero;
    if(val.includes(termino)) return c;
  }
  return null;
}
function motivoInactividad(c){
  if(c.pendienteInicio && c.fechaInicio) return `todavía no ha llegado a su fecha de alta (${c.fechaInicio})`;
  if(c.pausaInicio && !c.pausaFin) return 'está de baja permanente';
  if(c.pausaFin) return `está en pausa hasta el ${c.pausaFin}`;
  return 'está marcado como inactivo';
}
// Si el texto coincide con un cliente inactivo/pendiente, avisa y, si se confirma, marca la franja como
// "forzada" para que la sincronización automática de inactivos no la vuelva a borrar.
function avisarSiClienteInactivoYContinuar(fechaObjetivo, horaFinal, valorFinal, esPermanente, diaSemana, callback){
  const cliente = clienteInactivoQueCoincide(valorFinal);
  if(!cliente){ callback(); return; }
  showConfirm(`${cliente.nombre} ${motivoInactividad(cliente)}. Si confirmas, se mostrará igualmente en este hueco (no se borrará solo). ¿Continuar?`, ()=>{
    if(!state.horario.franjasForzadas) state.horario.franjasForzadas=[];
    const clave = esPermanente ? `GRID|${diaSemana}|${horaFinal}` : `${fechaObjetivo}|${horaFinal}`;
    if(!state.horario.franjasForzadas.includes(clave)) state.horario.franjasForzadas.push(clave);
    callback();
  });
}
function clientsWithUpcomingAviso(){
  const porInicio = state.clients.filter(c=>{
    if(!c.fechaInicio || !c.pendienteInicio) return false;
    const eff = nextBusinessDay(c.fechaInicio);
    const dias = daysUntil(eff);
    return dias>=0 && dias<=(c.avisoDias||15);
  }).map(c=>({ nombre:c.nombre, fecha: nextBusinessDay(c.fechaInicio), tipo:'inicio' }));
  const porReactivacion = state.clients.filter(c=>{
    if(!c.pausaFin || c.activo!==false) return false;
    const eff = nextBusinessDay(c.pausaFin);
    const dias = daysUntil(eff);
    return dias>=0 && dias<=(c.avisoDias||15);
  }).map(c=>({ nombre:c.nombre, fecha: nextBusinessDay(c.pausaFin), tipo:'reactivación' }));
  return [...porInicio, ...porReactivacion];
}

const RAW_CLIENTS = [

 altura:"156 cm", pesoActual:"No especificado", pesoDeseado:"No especificado", ejercicioRegular:"Sí — gimnasio y baile", nivelForma:"Bajo", estres:"Medio", sueno:"Bueno (8 h)", alimentacion:"No especificada", fumaAlcohol:"No",
 principal:"Ganancia muscular, tonificación", zona:"Brazos y cuerpo en general", dias:"1", preferencia:"Gimnasio",

const APP_VERSION = '2026-08-07-2';
let state = null;
function comprobarVersionNueva(){
  fetch('./index.html?_=' + Date.now(), {cache:'no-store'})
    .then(r=>r.text())
    .then(html=>{
      const m = html.match(/const APP_VERSION = '([^']+)'/);
      if(m && m[1] && m[1]!==APP_VERSION){
        mostrarAvisoVersionNueva();
      }
    })
    .catch(()=>{}); // sin conexión o fallo silencioso: no molestamos con errores por esto
}
function mostrarAvisoVersionNueva(){
  if(document.getElementById('aviso-version-nueva')) return; // ya se está mostrando
  const banner=document.createElement('div');
  banner.id='aviso-version-nueva';
  banner.style.cssText='position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--accent);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:9999;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;cursor:pointer;';
  banner.innerHTML = `<span>🔄 Hay una versión nueva de la app — toca para actualizar</span>`;
  banner.onclick = ()=>{ window.location.reload(); };
  document.body.appendChild(banner);
}

async function loadState(){
  try{
    const res = await storageBackend.get(STORAGE_KEY);
    if(res && res.value){
      state = JSON.parse(res.value);
      guardarCopiaLocalDeSeguridad(res.value);
      if(!state.programs){
        // Migra sesiones antiguas (guardadas por cliente individual) al nuevo esquema por unidad de entrenamiento
        state.programs = {};
        if(state.sessions){
          Object.keys(state.sessions).forEach(cid=>{
            const cl = (state.clients||[]).find(c=>c.id===cid);
            if(cl && state.sessions[cid] && state.sessions[cid].weeks && state.sessions[cid].weeks.length){
              const key = 'solo::'+cid;
              if(!state.programs[key]) state.programs[key]=state.sessions[cid];
            }
          });
        }
      }
      if(!state.horario){
        state.horario = JSON.parse(JSON.stringify(DEFAULT_HORARIO));
      }
      if(!state.horario.excepciones) state.horario.excepciones = {};
      if(!state.horario.franjasReservadas) state.horario.franjasReservadas = [];
      if(!state.horario.notasPorFranja) state.horario.notasPorFranja = {};
      if(!state.horario.duracionPorFranja) state.horario.duracionPorFranja = {};
      if(!state.horario.plantillasFuturas) state.horario.plantillasFuturas = [];
      if(!state.horario.franjasForzadas) state.horario.franjasForzadas = [];
      if(!state.horario.plantillasFuturas.some(p=>p.desde==='2026-09-01')){
        state.horario.plantillasFuturas.push({
          desde: '2026-09-01',

          }
        });
      }
      // Corrección puntual: Silvia Martín pasa de Jueves 14:00 a Jueves 13:00 en la plantilla de septiembre,
      // se aplica aunque la plantilla ya estuviera guardada de antes con la hora incorrecta.
      const plantillaSept = state.horario.plantillasFuturas.find(p=>p.desde==='2026-09-01');
      if(plantillaSept && plantillaSept.grid['Jueves|14:00']==='Silvia Martín'){
        plantillaSept.grid['Jueves|14:00'] = 'Oficina';
        plantillaSept.grid['Jueves|13:00'] = 'Silvia Martín';
      }
      if(plantillaSept && plantillaSept.grid['Miércoles|12:00']==='Marisa Flores'){
        plantillaSept.grid['Miércoles|12:00'] = 'Oficina';
      }
      if(state.horario.grid['Martes|17:00']==='Pilar (individual)' || state.horario.grid['Martes|17:00']===''){
        state.horario.grid['Martes|17:00'] = 'Oficina'; // Pilar Cloux en pausa: hueco liberado a Oficina
      }
      // Norma: los clientes individuales aparecen en el horario con nombre + primer apellido, tal cual el documento
      const RENOMBRAR_HORARIO = {
        'Raquel':'Raquel Clemente','Fernando':'Fernando Belenchón','MariaJesus':'M. Jesús Salvador',
        'Benito':'Benito Muñoz','Alfonso':'Alfonso Pueyo','Aroa':'Aroa Torrijos','Ricardo':'Ricardo Mosteo',

        'Elena':'Elena Edo','Pilar (VIP)':'Pilar Pérez','Pilar Pérez (VIP)':'Pilar Pérez',
        'Cristina del Valle (semanas impares)':'Cristina del Valle'
      };
      Object.keys(state.horario.grid).forEach(k=>{
        const v = state.horario.grid[k];
        if(RENOMBRAR_HORARIO[v]) state.horario.grid[k] = RENOMBRAR_HORARIO[v];
      });
      Object.keys(state.horario.excepciones).forEach(k=>{
        const v = state.horario.excepciones[k];
        if(RENOMBRAR_HORARIO[v]) state.horario.excepciones[k] = RENOMBRAR_HORARIO[v];
      });
      if(state.horario.notas && state.horario.notas.indexOf('Cristina alterna')===0){
        state.horario.notas = '';
      }
      if(state.horario.notas && state.horario.notas.indexOf('Cristina del Valle no tiene franja fija')===0){
        state.horario.notas = '';
      }
      // Corrección: Cristina no tiene franja fija, es móvil semana a semana — se quita del patrón recurrente por completo
      if(state.horario.grid['Jueves|11:30']==='Cristina del Valle'){
        state.horario.grid['Jueves|11:30'] = '';
      }
      if(state.horario.grid['Lunes|12:00']==='Cristina del Valle'){
        state.horario.grid['Lunes|12:00'] = 'Oficina';
      }
      if(state.horario.grid['Jueves|12:00']==='Cristina del Valle'){
        state.horario.grid['Jueves|12:00'] = 'Oficina';
      }
      Object.keys(state.horario.excepciones).forEach(k=>{
        if(k.endsWith('|11:30') && state.horario.excepciones[k]==='Cristina del Valle') delete state.horario.excepciones[k];
      });
      // El entrenador pidió no tocar el horario: revertimos cualquier inserción previa de Funcional/Pilates a su estado anterior
      const REVERTIR_HORARIO = {
        'Lunes|08:00':'Oficina','Lunes|16:00':'','Lunes|18:00':'','Lunes|19:00':'',
        'Miércoles|08:00':'Oficina','Miércoles|16:00':'','Miércoles|18:00':'','Miércoles|19:00':'',
        'Jueves|10:00':'Oficina','Jueves|11:00':'Oficina','Jueves|16:00':''
      };
      Object.keys(REVERTIR_HORARIO).forEach(k=>{
        if(state.horario.grid[k]==='Funcional' || state.horario.grid[k]==='Pilates') state.horario.grid[k]=REVERTIR_HORARIO[k];
      });
      if(!state.temporizadorPlantillas) state.temporizadorPlantillas = [];
      if(!state.clients || state.clients.length===0){
        state.clients = DEFAULT_CLIENTS;
      } else {
        const nombresClientesExistentes = new Set(state.clients.map(c=>c.nombre.trim().toLowerCase()));
        DEFAULT_CLIENTS.forEach(nuevo=>{
          if(!nombresClientesExistentes.has(nuevo.nombre.trim().toLowerCase())){
            state.clients.push(JSON.parse(JSON.stringify(nuevo)));
          }
        });
      }
      if(!state.exercises || state.exercises.length===0){
        state.exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
      } else {
        const nombresExistentes = new Set(state.exercises.map(e=>e.nombre.trim().toLowerCase()));
        DEFAULT_EXERCISES.forEach(nuevo=>{
          if(!nombresExistentes.has(nuevo.nombre.trim().toLowerCase())){
            state.exercises.push(JSON.parse(JSON.stringify(nuevo)));
          }
        });
      }
      if(!state.grupos || state.grupos.length===0){
        state.grupos = JSON.parse(JSON.stringify(DEFAULT_GRUPOS));
      } else if(state.grupos.some(g=>typeof g.horarios === 'undefined')){
        // Reestructuración pedida por el entrenador: solo 2 tarjetas (Funcional, Pilates) con sus horarios desplegables dentro
        const viejosConContenido = state.grupos.filter(g=>(g.weeks && g.weeks.length>0) || (g.inscritos && g.inscritos.length>0));
        state.grupos = JSON.parse(JSON.stringify(DEFAULT_GRUPOS));
        viejosConContenido.forEach(viejo=>{
          const clase = state.grupos.find(c=>c.nombre===viejo.nombre);
          if(!clase) return;
          const horarioExistente = clase.horarios.find(h=>h.hora===viejo.hora && viejo.dias && viejo.dias.every(d=>h.dias.includes(d)));
          if(horarioExistente){
            horarioExistente.weeks = viejo.weeks;
            horarioExistente.inscritos = viejo.inscritos;
            horarioExistente.aforoMaximo = viejo.aforoMaximo;
          } else {
            clase.horarios.push({ id: uid(), dias: viejo.dias||[], hora: viejo.hora||'', aforoMaximo: viejo.aforoMaximo||null, inscritos: viejo.inscritos||[], weeks: viejo.weeks||[], fechaInicio: viejo.fechaInicio||'2026-09-01' });
          }
        });
      }
      // Añade Pilates VIP y Pilates VIP 2 si todavía no existían en un estado ya guardado
      ['Pilates VIP','Pilates VIP 2'].forEach(nombreClase=>{
        if(!state.grupos.some(c=>c.nombre===nombreClase)){
          const base = DEFAULT_GRUPOS.find(c=>c.nombre===nombreClase);
          if(base) state.grupos.push(JSON.parse(JSON.stringify(base)));
        }
      });
      state.grupos.forEach(clase=>{
        (clase.horarios||[]).forEach(h=>{
          if(!h.fechaInicio) h.fechaInicio='2026-09-01';
          if(h.aforoMaximo===null || typeof h.aforoMaximo==='undefined') h.aforoMaximo=6;
        });
      });
      if(typeof state.activeGrupoId === 'undefined') state.activeGrupoId = null;
      if(!state.version || state.version < DATA_VERSION){
        // Corrige datos de clientes desalineados de una versión anterior, conservando ejercicios y planes ya creados
        state.clients = DEFAULT_CLIENTS;
        state.version = DATA_VERSION;
        await saveState();
      }
      (state.clients||[]).forEach(c=>{ if(typeof c.activo === 'undefined') c.activo = true; if(typeof c.fechaInicio === 'undefined') c.fechaInicio=''; });
      return;
    }
  }catch(e){
    // El almacenamiento principal ha fallado (p.ej. corte técnico de la plataforma) — intentamos recuperar
    // la última copia guardada localmente en este navegador antes de resetear nada.
    const backup = intentarCargarCopiaLocalDeSeguridad();
    if(backup){
      state = backup;
      console.warn('Almacenamiento principal no disponible: recuperados los datos de la copia local de este navegador.');
      return;
    }
  }
  state = { clients: DEFAULT_CLIENTS, exercises: JSON.parse(JSON.stringify(DEFAULT_EXERCISES)), programs: {}, horario: JSON.parse(JSON.stringify(DEFAULT_HORARIO)), grupos: JSON.parse(JSON.stringify(DEFAULT_GRUPOS)), temporizadorPlantillas: [], activeGrupoId: null, activeTab:'clientes', activeClientId:null, version: DATA_VERSION };
  await saveState();
}
function guardarCopiaLocalDeSeguridad(payloadStr){
  try{ localStorage.setItem(STORAGE_KEY+'-backup-local', payloadStr); }catch(e){ /* almacenamiento local no disponible, no es crítico */ }
}
function intentarCargarCopiaLocalDeSeguridad(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY+'-backup-local');
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

let saveTimer=null;
let saveInProgress=false;
let savePendingAgain=false;
let saveStatus='ok'; // 'ok' | 'saving' | 'error'

async function saveState(){
  if(saveInProgress){ savePendingAgain=true; return; }
  saveInProgress=true;
  saveStatus='saving';
  updateSaveIndicator();
  const payload = JSON.stringify(state);
  guardarCopiaLocalDeSeguridad(payload); // red de seguridad local, independiente de si el guardado principal funciona
  let intentos=0;
  let ok=false;
  while(intentos<3 && !ok){
    try{
      await storageBackend.set(STORAGE_KEY, payload);
      ok=true;
    }catch(e){
      intentos++;
      if(intentos<3){
        await new Promise(r=>setTimeout(r, 800*intentos)); // pequeña espera antes de reintentar
      } else {
        console.error('Error guardando tras varios intentos', e);
      }
    }
  }
  saveStatus = ok ? 'ok' : 'error';
  updateSaveIndicator();
  saveInProgress=false;
  if(savePendingAgain){ savePendingAgain=false; scheduleSave(); }
  else if(!ok){ setTimeout(saveState, 10000); } // reintento automático más adelante si sigue fallando (posible corte puntual de la plataforma)
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveState, 600); // debounce más amplio para no saturar el guardado con ediciones rápidas
}
function updateSaveIndicator(){
  const el=document.getElementById('save-indicator');
  if(!el) return;
  if(saveStatus==='saving'){ el.textContent='Guardando…'; el.style.color='var(--ink-soft)'; }
  else if(saveStatus==='error'){ el.textContent='⚠ Fallo puntual del guardado en la nube — tienes una copia a salvo en este navegador, se reintentará solo.'; el.style.color='var(--danger)'; }
  else { el.textContent=''; }
}

let undoStack = [];
function pushUndoSnapshot(){
  if(!state) return;
  const snap = JSON.stringify(state);
  if(undoStack.length===0 || undoStack[undoStack.length-1]!==snap){
    undoStack.push(snap);
    if(undoStack.length>50) undoStack.shift();
  }
}
function deshacerCambio(){
  if(undoStack.length<2) return;
  undoStack.pop();
  const anterior = undoStack[undoStack.length-1];
  state = JSON.parse(anterior);
  scheduleSave();
  render();
}

function icsFechaHora(fecha, hora){
  return fecha.replace(/-/g,'') + 'T' + hora.replace(':','') + '00';
}
function exportarICS(semanas){
  try{
    const inicio = startOfWeekStr(todayStr());
    let eventos = [];
    for(let s=0; s<semanas; s++){
      const inicioSemana = addDaysStr(inicio, s*7);
      for(let d=0; d<5; d++){
        const fecha = addDaysStr(inicioSemana, d);
        state.horario.horas.forEach(hora=>{
          const valor = horarioValor(fecha, hora);
          const tipo = tipoCelda(valor);
          if(tipo==='oficina') return;
          const duracionMin = duracionDeFranja(fecha, hora);
          const inicioDT = new Date(fecha+'T'+hora+':00');
          const finDT = new Date(inicioDT.getTime() + duracionMin*60000);
          const horaFin = String(finDT.getHours()).padStart(2,'0')+':'+String(finDT.getMinutes()).padStart(2,'0');
          eventos.push({
            uid: 'phyosgym-'+fecha+'-'+hora.replace(':','')+'@phyosgym',
            dtstart: icsFechaHora(fecha, hora),
            dtend: icsFechaHora(fecha, horaFin),
            summary: textoLimpio(valor)
          });
        });
      }
    }
    if(eventos.length===0){
      showAlert('No hay ninguna franja ocupada en las próximas semanas para exportar.');
      return;
    }
    const ahora = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
    let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Phyos Gym//Horario//ES\r\nCALSCALE:GREGORIAN\r\n';
    eventos.forEach(ev=>{
      ics += 'BEGIN:VEVENT\r\n';
      ics += 'UID:'+ev.uid+'\r\n';
      ics += 'DTSTAMP:'+ahora+'\r\n';
      ics += 'DTSTART:'+ev.dtstart+'\r\n';
      ics += 'DTEND:'+ev.dtend+'\r\n';
      ics += 'SUMMARY:'+ev.summary.replace(/,/g,'\\,')+'\r\n';
      ics += 'END:VEVENT\r\n';
    });
    ics += 'END:VCALENDAR\r\n';
    const blob = new Blob([ics], {type:'text/calendar'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `phyos-gym-horario-${todayStr()}.ics`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }catch(e){
    showAlert('No se pudo generar el archivo de calendario. Inténtalo de nuevo.');
  }
}

const DIAS_ES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function toDate(str){ return new Date(str+'T00:00:00'); }
function fromDate(d){ return fechaLocalStr(d); }
function addDaysStr(str, n){ const d=toDate(str); d.setDate(d.getDate()+n); return fromDate(d); }
function startOfWeekStr(str){
  const d=toDate(str);
  const dow = d.getDay(); // 0=domingo
  const diff = dow===0 ? -6 : 1-dow; // retrocede hasta el lunes
  d.setDate(d.getDate()+diff);
  return fromDate(d);
}
function nombreDiaEs(str){ return DIAS_ES[toDate(str).getDay()]; }
function diasDeLaSemana(fecha){
  const inicio = startOfWeekStr(fecha);
  return [0,1,2,3,4].map(i=>addDaysStr(inicio,i));
}
function esFinde(str){ const dow=toDate(str).getDay(); return dow===0||dow===6; }

function gridVigentePara(fechaStr){
  const h = state.horario;
  if(h.plantillasFuturas && h.plantillasFuturas.length){
    const aplicables = h.plantillasFuturas.filter(p=>fechaStr >= p.desde).sort((a,b)=>b.desde.localeCompare(a.desde));
    if(aplicables.length) return aplicables[0].grid;
  }
  return h.grid;
}
function horarioValor(fechaStr, hora){
  const h = state.horario;
  const key = fechaStr+'|'+hora;
  if(Object.prototype.hasOwnProperty.call(h.excepciones, key)) return h.excepciones[key];
  const dia = nombreDiaEs(fechaStr);
  return gridVigentePara(fechaStr)[dia+'|'+hora] || '';
}
function horarioSet(fechaStr, hora, val){
  state.horario.excepciones[fechaStr+'|'+hora] = val;
  scheduleSave();
}
// Al fijar algo de forma permanente para un día+hora, cualquier excepción puntual anterior en ese mismo
// día de la semana+hora (de semanas pasadas o futuras) queda "tapando" el cambio permanente. La quitamos
// para que lo fijado se vea de verdad en todas las semanas.
function limpiarExcepcionesDeDia(diaSemana, hora){
  Object.keys(state.horario.excepciones).forEach(key=>{
    const [fechaKey, horaKey] = key.split('|');
    if(horaKey===hora && nombreDiaEs(fechaKey)===diaSemana){
      delete state.horario.excepciones[key];
    }
  });
}
function formatFechaLarga(fechaStr){
  const d=toDate(fechaStr);
  return `${nombreDiaEs(fechaStr)} ${d.getDate()} de ${d.toLocaleDateString('es-ES',{month:'long'})} de ${d.getFullYear()}`;
}

function pitido(frecuencia, duracionMs){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type='sine'; osc.frequency.value=frecuencia;
    osc.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + duracionMs/1000);
    setTimeout(()=>ctx.close(), duracionMs+100);
  }catch(e){ /* audio no disponible, seguimos sin sonido */ }
  if(navigator.vibrate) navigator.vibrate(duracionMs>250?200:80);
}

  function actualizarDisplay(){
    if(!estado) return;

    if(!info){ ejercicioBox.style.display='none'; return; }
    ejercicioBox.style.display='block';
    if(estado.fase==='descanso'){
      const siguiente = sesionTemporizadorActual[estado.rondaActual];

      const nombreEl = ejercicioBox.querySelector('.t-ejercicio-actual-nombre');
      if(nombreEl) nombreEl.onclick=()=>abrirInfoEjercicio(info.ex);

  function tick(){
    if(!estado || estado.pausado) return;
    estado.segundosRestantes--;
    if(estado.segundosRestantes<=3 && estado.segundosRestantes>0){ pitido(660,120); }
    if(estado.segundosRestantes<=0){
      if(estado.fase==='trabajo'){
        const descansoRonda = sesionTemporizadorActual.length>0
          ? (sesionTemporizadorActual[estado.rondaActual-1]?.descansoSeg ?? estado.descanso)
          : estado.descanso;
        if(descansoRonda>0){
          estado.fase='descanso';
          estado.segundosRestantes=descansoRonda;
          pitido(440,300);
        } else {
          avanzarRonda();
          return;
        }
      } else {
        avanzarRonda();
        return;
      }
    }
    actualizarDisplay();
  }
  function avanzarRonda(){
    if(estado.rondaActual>=estado.totalRondas){
      pitido(880,500);
      faseEl().textContent='✔ Completado';
      tiempoEl().textContent='00:00';
      rondaEl().textContent=`${estado.totalRondas} rondas completadas`;
      clearInterval(temporizadorInterval); temporizadorInterval=null;
      btnIniciar.disabled=false; btnIniciar.textContent='▶ Iniciar';
      btnPausar.disabled=true;
      estado=null;
      return;
    }
    estado.rondaActual++;
    estado.fase='trabajo';
    estado.segundosRestantes=estado.trabajo;
    pitido(660,300);
    actualizarDisplay();
  }
  function irARonda(numero){
    if(!estado) return;
    const objetivo = Math.max(1, Math.min(estado.totalRondas, numero));
    estado.rondaActual = objetivo;
    estado.fase = 'trabajo';
    estado.segundosRestantes = estado.trabajo;
    estado.pausado = false;
    pitido(660,200);
    actualizarDisplay();
    btnIniciar.disabled=true; btnPausar.disabled=false; btnIniciar.textContent='▶ Iniciar';
    if(!temporizadorInterval) temporizadorInterval=setInterval(tick,1000);
  }
  btnSiguiente.onclick=()=>{
    if(!estado) return;
    if(estado.rondaActual>=estado.totalRondas){ avanzarRonda(); return; }
    irARonda(estado.rondaActual+1);
  };
  btnAnterior.onclick=()=>{
    if(!estado) return;
    irARonda(estado.rondaActual-1);
  };
  btnIniciar.onclick=()=>{
    if(estado && estado.pausado){
      estado.pausado=false;
      btnIniciar.disabled=true; btnPausar.disabled=false;
      return;
    }
    const trabajo = parseInt(wrap.querySelector('#t-trabajo').value)||30;
    const descanso = parseInt(wrap.querySelector('#t-descanso').value)||0;
    const rondas = parseInt(wrap.querySelector('#t-rondas').value)||1;
    temporizadorPreset = {trabajo, descanso, rondas};
    estado = { fase:'trabajo', segundosRestantes:trabajo, rondaActual:1, totalRondas:rondas, trabajo, descanso, pausado:false };
    pitido(660,300);
    actualizarDisplay();
    btnIniciar.disabled=true; btnPausar.disabled=false;
    if(temporizadorInterval) clearInterval(temporizadorInterval);
    temporizadorInterval=setInterval(tick, 1000);
  };
  btnPausar.onclick=()=>{
    if(!estado) return;
    estado.pausado=true;
    btnIniciar.disabled=false; btnIniciar.textContent='▶ Reanudar';
    btnPausar.disabled=true;
  };
  btnReiniciar.onclick=()=>{
    if(temporizadorInterval){ clearInterval(temporizadorInterval); temporizadorInterval=null; }
    estado=null;
    faseEl().textContent='Listo para empezar';
    tiempoEl().textContent='00:00';
    rondaEl().textContent='';
    display.style.background='var(--surface)';
    btnIniciar.disabled=false; btnIniciar.textContent='▶ Iniciar';
    btnPausar.disabled=true;
    ejercicioBox.style.display='none';
  };

  return wrap;
}

  if(horarioModo!=='mes'){
    const leyenda=document.createElement('div');

      <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:#FFB347;display:inline-block;"></span>Entrevista</span>
      <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:#3FAF7F;display:inline-block;"></span>Otro</span>
      <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:#E8402C;display:inline-block;"></span>Comida</span>
      <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:transparent;border:1px solid var(--line);display:inline-block;"></span>Oficina</span>
    `;
    wrap.appendChild(leyenda);

    const addNotaWrap=document.createElement('div'); addNotaWrap.id='add-nota-wrap'; addNotaWrap.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;';
    const notaFecha=document.createElement('input'); notaFecha.id='add-nota-fecha'; notaFecha.type='date'; notaFecha.value=horarioFecha; notaFecha.style.cssText='padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:12.5px;';
    const notaHora=document.createElement('input'); notaHora.id='add-nota-hora'; notaHora.type='time'; notaHora.step='60'; notaHora.style.cssText='padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:12.5px;';
    const notaModo=document.createElement('select'); notaModo.style.cssText='padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:12.5px;';
    notaModo.innerHTML=`
      <option value="semana">Solo esta semana (fecha concreta)</option>
      <option value="permanente">De forma permanente (todas las semanas, ese día)</option>
    `;
    const notaTipo=document.createElement('select'); notaTipo.style.cssText='padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:12.5px;';
    notaTipo.innerHTML=`
      <option value="personal">Entrenamiento personal / pareja</option>

      <option value="entrevista">Entrevista</option>
      <option value="otro">Otro</option>
      <option value="oficina">Oficina</option>
    `;
    const notaFinLabel=document.createElement('span'); notaFinLabel.textContent='hasta'; notaFinLabel.style.cssText='font-size:12px;color:var(--ink-soft);';
    const notaFin=document.createElement('input'); notaFin.type='time'; notaFin.step='60'; notaFin.style.cssText='padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:12.5px;';
    let notaFinTocadaAMano=false;
    notaFin.oninput=()=>{ notaFinTocadaAMano=true; };
    function actualizarFinPorDefecto(){
      if(notaFinTocadaAMano || !notaHora.value) return;
      notaFin.value = sumarMinutos(notaHora.value, duracionPorDefecto(notaTipo.value));
    }
    notaHora.addEventListener('input', actualizarFinPorDefecto);
    notaTipo.addEventListener('change', ()=>{ notaFinTocadaAMano=false; actualizarFinPorDefecto(); });
    const notaTexto=document.createElement('input'); notaTexto.placeholder='Texto (nombre, motivo...)'; notaTexto.style.cssText='padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:12.5px;flex:1;min-width:160px;';
    const addNotaBtn=document.createElement('button'); addNotaBtn.className='btn btn-sm'; addNotaBtn.textContent='+ Añadir al horario';

    // Si la fecha+hora elegidas ya tienen algo puesto, lo cargamos aquí mismo para poder verlo y sobrescribirlo directamente.
    function cargarSiYaExiste(){
      if(!notaFecha.value || !notaHora.value) return;
      const valorActual = horarioValor(notaFecha.value, notaHora.value);
      const tipoActual = tipoCelda(valorActual);
      if(tipoActual!=='oficina'){
        notaTexto.value = textoLimpio(valorActual);
        notaTipo.value = tipoActual;
        addNotaBtn.textContent = '💾 Guardar cambio (sobrescribe lo que ya había)';
      } else {
        addNotaBtn.textContent = '+ Añadir al horario';
      }
    }
    notaFecha.addEventListener('change', cargarSiYaExiste);
    notaHora.addEventListener('change', cargarSiYaExiste);

    function guardarFranja(fechaObjetivo, horaFinal, valorFinal, duracionMin){
      const escribirDeVerdad = ()=>{
        if(notaModo.value==='permanente'){
          const dia = nombreDiaEs(fechaObjetivo);
          gridVigentePara(fechaObjetivo)[dia+'|'+horaFinal] = valorFinal;
          delete state.horario.excepciones[fechaObjetivo+'|'+horaFinal];
          limpiarExcepcionesDeDia(dia, horaFinal);
          scheduleSave();
        } else {
          horarioSet(fechaObjetivo, horaFinal, valorFinal);
        }
        if(valorFinal.trim()) aplicarDuracionFranja(fechaObjetivo, horaFinal, duracionMin);
        render();
      };
      const continuarConSolape = ()=>{
        if(valorFinal.trim()){
          verificarSolapeAntesDeGuardar(fechaObjetivo, horaFinal, duracionMin, horaFinal, escribirDeVerdad);
        } else {
          escribirDeVerdad();
        }
      };
      const esPermanente = notaModo.value==='permanente';
      avisarSiClienteInactivoYContinuar(fechaObjetivo, horaFinal, valorFinal, esPermanente, nombreDiaEs(fechaObjetivo), continuarConSolape);
    }

    function valorActualEnDestino(fechaObjetivo, horaFinal){
      if(notaModo.value==='permanente'){
        return state.horario.grid[nombreDiaEs(fechaObjetivo)+'|'+horaFinal] || '';
      }
      return horarioValor(fechaObjetivo, horaFinal);
    }
    function confirmarYGuardar(fechaObjetivo, horaFinal, valorFinal, duracionMin, alTerminar){
      const actual = valorActualEnDestino(fechaObjetivo, horaFinal);
      if(actual && actual.trim().toLowerCase()!=='oficina' && textoLimpio(actual).toLowerCase()!==textoLimpio(valorFinal).toLowerCase()){
        showConfirm(`Ese hueco ya tiene "${actual}". ¿Sobrescribir?`, ()=>{
          guardarFranja(fechaObjetivo, horaFinal, valorFinal, duracionMin);
          alTerminar();
        });
      } else {
        guardarFranja(fechaObjetivo, horaFinal, valorFinal, duracionMin);
        alTerminar();
      }
    }

    addNotaBtn.onclick=()=>{
      if(!notaFecha.value){ showAlert('Indica una fecha.'); return; }
      if(!notaHora.value){ showAlert('Indica una hora (puedes escribirla o elegirla con el selector).'); return; }
      if(!notaTexto.value.trim()){
        if(notaTipo.value==='oficina'){
          const horaFinal = notaHora.value;
          const finElegidoOficina = notaFin.value || sumarMinutos(horaFinal, 60);
          const duracionOficina = minutosEntreHoras(horaFinal, finElegidoOficina);
          confirmarYGuardar(notaFecha.value, horaFinal, 'Oficina', duracionOficina, ()=>{
            horarioFecha = notaFecha.value;
            render();
          });
          return;
        }
        showAlert('Escribe un texto (nombre del cliente, clase, motivo...) antes de guardar.');
        return;
      }
      const horaFinal = notaTipo.value==='entrevista' ? redondearAMediaHora(notaHora.value) : notaHora.value;
      if(!state.horario.horas.includes(horaFinal)){ state.horario.horas.push(horaFinal); state.horario.horas.sort(); }
      const prefijo = PREFIJO_TIPO[notaTipo.value] || '';
      const finElegido = notaFin.value || sumarMinutos(horaFinal, duracionPorDefecto(notaTipo.value));
      const duracionMin = minutosEntreHoras(horaFinal, finElegido);
      confirmarYGuardar(notaFecha.value, horaFinal, prefijo+notaTexto.value.trim(), duracionMin, ()=>{
        horarioFecha = notaFecha.value;
        notaTexto.value=''; notaHora.value=''; notaFin.value=''; notaFinTocadaAMano=false;
        addNotaBtn.textContent = '+ Añadir al horario';
        render();
      });
    };
    addNotaWrap.appendChild(notaFecha); addNotaWrap.appendChild(notaHora); addNotaWrap.appendChild(notaFinLabel); addNotaWrap.appendChild(notaFin); addNotaWrap.appendChild(notaModo); addNotaWrap.appendChild(notaTipo); addNotaWrap.appendChild(notaTexto); addNotaWrap.appendChild(addNotaBtn);
    crearAutocompleteTexto(notaTexto, nombresConocidosParaHorario);
    wrap.appendChild(addNotaWrap);
  }

  if(horarioModo==='dia') wrap.appendChild(horarioDiaViewEscala());
  else if(horarioModo==='semana') wrap.appendChild(horarioSemanaViewEscala());
  else wrap.appendChild(horarioMesView());

  return wrap;
}

function attachDragDrop(td, fecha, hora){

  td.ondragleave = ()=>{ td.style.background=''; };

    e.preventDefault();

    horarioSet(fecha, hora, srcVal);
    horarioSet(src.fecha, src.hora, destVal);

  };
}

// Celda: si tiene contenido real, se muestra como chip clicable (clic = mover); si está vacía u "Oficina", input libre editable.
function tipoCelda(valor){
  const v=(valor||'').trim();
  if(!v || v.toLowerCase()==='oficina') return 'oficina';
  if(v.indexOf('🔵')===0) return 'grupo';
  if(v.indexOf('🟣')===0) return 'personal';
  if(v.indexOf('🟠')===0) return 'entrevista';
  if(v.indexOf('⚪')===0){
    const texto = v.replace(/^⚪\s*/,'').trim().toLowerCase();
    if(texto==='comida') return 'comida';
    return 'otro';
  }
  if(v.indexOf('📝')===0) return 'entrevista'; // compatibilidad con anotaciones creadas antes de tener el desplegable de tipo
  const esGrupo = state.grupos.some(c=>v.toLowerCase().includes(c.nombre.toLowerCase()));
  return esGrupo ? 'grupo' : 'personal';
}
function colorPorTipo(tipo){
  switch(tipo){
    case 'grupo': return '#9B6DFF';
    case 'entrevista': return '#FFB347';
    case 'otro': return '#3FAF7F';
    case 'personal': return '#FF6B35';
    case 'comida': return '#E8402C';
    default: return 'transparent';
  }
}
const PREFIJO_TIPO = { grupo:'🔵 ', personal:'🟣 ', entrevista:'🟠 ', otro:'⚪ ' };
function fondoCelda(tipo){
  if(tipo==='oficina') return 'transparent';
  const hex = colorPorTipo(tipo);
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},0.16)`;
}
function textoColorParaTipo(tipo){
  return tipo==='oficina' ? 'var(--ink-soft)' : 'var(--ink)';
}
function aplicarEstiloCelda(container, tipo){
  container.style.background = fondoCelda(tipo);
  container.style.border = tipo==='oficina' ? '1px solid var(--line)' : `2px solid ${colorPorTipo(tipo)}`;
  container.style.borderRadius = '0';
}
function horaBase(hora){
  const [h] = hora.split(':').map(Number);
  return String(h).padStart(2,'0')+':00';
}
function esFranjaContinuacion(fecha, hora){
  const valPropio = horarioValor(fecha, hora);
  if(valPropio.trim()) return false;
  const reservada = (state.horario.franjasReservadas||[]).includes(fecha+'|'+hora);
  if(reservada) return false;
  // Mira la hora inmediatamente anterior entre todas las que se muestran ese día (sean en punto o media),
  // y comprueba si su duración real se alarga hasta cubrir esta hora — así funciona sea cual sea la hora de inicio.
  const horasOrdenadas = [...new Set([...HORAS_BASE, ...state.horario.horas])].sort();
  const idx = horasOrdenadas.indexOf(hora);
  if(idx<=0) return false;
  const horaAnt = horasOrdenadas[idx-1];
  const valAnt = horarioValor(fecha, horaAnt);
  if(!valAnt.trim()) return false;
  const dur = duracionDeFranja(fecha, horaAnt);
  const finAnt = sumarMinutos(horaAnt, dur);
  return finAnt > hora; // la franja anterior, con su duración real, se alarga hasta esta hora o más
}

function redondearAMediaHora(horaStr){
  if(!horaStr) return horaStr;
  const [h,m] = horaStr.split(':').map(Number);
  const totalMin = h*60+(m||0);
  const redondeado = Math.round(totalMin/30)*30;
  const hh = String(Math.floor(redondeado/60)).padStart(2,'0');
  const mm = String(redondeado%60).padStart(2,'0');
  return `${hh}:${mm}`;
}
function sumarMinutos(horaStr, minutos){
  const [h,m] = horaStr.split(':').map(Number);
  const total = h*60+(m||0)+minutos;
  const hh = String(Math.floor(total/60)%24).padStart(2,'0');
  const mm = String(((total%60)+60)%60).padStart(2,'0');
  return `${hh}:${mm}`;
}
function minutosEntreHoras(horaInicio, horaFin){
  const [h1,m1] = horaInicio.split(':').map(Number);
  const [h2,m2] = horaFin.split(':').map(Number);
  let diff = (h2*60+m2) - (h1*60+m1);
  if(diff<=0) diff += 24*60;
  return diff;
}
function horaMasMedia(horaStr){
  return sumarMinutos(horaStr, 30);
}
function duracionPorDefecto(tipo){
  return tipo==='entrevista' ? 30 : 60; // grupo, personal, otro y oficina: 1 hora por defecto
}
function duracionDeFranja(fecha, hora){
  const clave = fecha+'|'+hora;
  if(state.horario.duracionPorFranja && typeof state.horario.duracionPorFranja[clave]==='number'){
    return state.horario.duracionPorFranja[clave];
  }
  return duracionPorDefecto(tipoCelda(horarioValor(fecha,hora)));
}
function finDeFranja(fecha, hora){
  return sumarMinutos(hora, duracionDeFranja(fecha,hora));
}

// ---------- MOTOR DE LÍNEA TEMPORAL A ESCALA REAL (vistas Día y Semana) ----------
const PX_POR_MIN_TIMELINE = 1.1;
function minutosDesdeMedianoche(horaStr){
  const [h,m] = horaStr.split(':').map(Number);
  return h*60+m;
}
function construirEventosDelDia(fecha){
  const horasOrdenadas = [...new Set([...HORAS_BASE, ...state.horario.horas])].sort();
  const eventos = [];
  horasOrdenadas.forEach(hora=>{
    const val = horarioValor(fecha, hora);
    if(!val.trim()) return;
    if(esFranjaContinuacion(fecha, hora)) return; // es la continuación de un evento anterior, no su propio inicio
    const dur = duracionDeFranja(fecha, hora);
    let finMin = minutosDesdeMedianoche(hora) + dur;
    eventos.push({ hora, iniMin: minutosDesdeMedianoche(hora), finMin, duracion: dur, valor: val });
  });
  return eventos;
}
function rangoTimelineParaFechas(fechas){
  let inicioMin = 8*60, finMin = 20*60;
  fechas.forEach(fecha=>{
    construirEventosDelDia(fecha).forEach(e=>{
      if(e.iniMin<inicioMin) inicioMin = Math.floor(e.iniMin/60)*60;
      if(e.finMin>finMin) finMin = Math.ceil(e.finMin/60)*60;
    });
  });
  return {inicioMin, finMin};
}
function gutterHorasTimeline(inicioMin, finMin){
  const gutter=document.createElement('div');
  gutter.style.cssText=`position:relative;width:46px;flex-shrink:0;height:${(finMin-inicioMin)*PX_POR_MIN_TIMELINE}px;`;
  for(let m=inicioMin; m<=finMin; m+=60){
    const lbl=document.createElement('div');
    lbl.style.cssText=`position:absolute;top:${(m-inicioMin)*PX_POR_MIN_TIMELINE-6}px;right:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);`;
    lbl.textContent = String(Math.floor(m/60)).padStart(2,'0')+':00';
    gutter.appendChild(lbl);
  }
  return gutter;
}
function agruparEventosSolapados(eventos){
  const ordenados = [...eventos].sort((a,b)=>a.iniMin-b.iniMin);
  const clusters = [];
  let actual = [];
  let finMaxActual = -Infinity;
  ordenados.forEach(ev=>{
    if(actual.length===0 || ev.iniMin < finMaxActual){
      actual.push(ev);
      finMaxActual = Math.max(finMaxActual, ev.finMin);
    } else {
      clusters.push(actual);
      actual = [ev];
      finMaxActual = ev.finMin;
    }
  });
  if(actual.length) clusters.push(actual);
  return clusters;
}
function moverFranjaPorArrastre(fechaOrigen, horaOrigen, fechaDestino, horaDestino, valor){
  if(fechaOrigen===fechaDestino && horaOrigen===horaDestino) return;
  const dur = duracionDeFranja(fechaOrigen, horaOrigen);
  const notaFranja = state.horario.notasPorFranja[fechaOrigen+'|'+horaOrigen];
  const escribir = ()=>{
    if(!state.horario.horas.includes(horaDestino)){ state.horario.horas.push(horaDestino); state.horario.horas.sort(); }
    horarioSet(fechaDestino, horaDestino, valor);
    horarioSet(fechaOrigen, horaOrigen, '');
    delete state.horario.duracionPorFranja[fechaOrigen+'|'+horaOrigen];
    delete state.horario.notasPorFranja[fechaOrigen+'|'+horaOrigen];
    aplicarDuracionFranja(fechaDestino, horaDestino, dur);
    if(notaFranja) state.horario.notasPorFranja[fechaDestino+'|'+horaDestino] = notaFranja;
    render();
  };
  const continuarConSolape = ()=>{
    verificarSolapeAntesDeGuardar(fechaDestino, horaDestino, dur, horaOrigen, escribir);
  };
  avisarSiClienteInactivoYContinuar(fechaDestino, horaDestino, valor, false, nombreDiaEs(fechaDestino), continuarConSolape);
}
function columnaDiaTimeline(fecha, inicioMin, finMin, registroColumnas){
  const alturaTotal = (finMin-inicioMin)*PX_POR_MIN_TIMELINE;
  const col=document.createElement('div');
  col.dataset.fecha = fecha;
  col.style.cssText=`position:relative;height:${alturaTotal}px;flex:1;min-width:0;border-left:1px solid var(--line);background:var(--surface);border-radius:0 0 8px 8px;touch-action:pan-y;`;
  if(registroColumnas) registroColumnas.push(col);
  for(let m=inicioMin; m<=finMin; m+=60){
    const linea=document.createElement('div');
    linea.style.cssText=`position:absolute;top:${(m-inicioMin)*PX_POR_MIN_TIMELINE}px;left:0;right:0;border-top:1px solid var(--line);pointer-events:none;`;
    col.appendChild(linea);
  }
  // Zona clicable de fondo: pulsar en un hueco vacío abre el creador ya con la fecha/hora aproximada
  col.addEventListener('click', (e)=>{
    if(e.target!==col) return;
    const rect = col.getBoundingClientRect();
    const yRel = e.clientY - rect.top;
    const minAprox = inicioMin + Math.round(yRel/PX_POR_MIN_TIMELINE/15)*15;
    const horaAprox = String(Math.floor(minAprox/60)).padStart(2,'0')+':'+String(minAprox%60).padStart(2,'0');
    const fechaInput = document.getElementById('add-nota-fecha');
    const horaInput = document.getElementById('add-nota-hora');
    if(fechaInput && horaInput){
      fechaInput.value = fecha; horaInput.value = horaAprox;
      horaInput.dispatchEvent(new Event('change'));
      document.getElementById('add-nota-wrap').scrollIntoView({behavior:'smooth', block:'center'});
    }
  });
  const clusters = agruparEventosSolapados(construirEventosDelDia(fecha));
  clusters.forEach(cluster=>{
    const enConflicto = cluster.length>1;
    const anchoPct = 100/cluster.length;
    cluster.forEach((ev,i)=>{
      const top = (ev.iniMin-inicioMin)*PX_POR_MIN_TIMELINE;
      const alto = Math.max((ev.finMin-ev.iniMin)*PX_POR_MIN_TIMELINE, 22);
      const tipo = tipoCelda(ev.valor);
      const bloque=document.createElement('div');
      const izq = `calc(${anchoPct*i}% + ${i===0?3:1.5}px)`;
      const anchoCss = `calc(${anchoPct}% - ${cluster.length>1?3:6}px)`;
      bloque.style.cssText=`position:absolute;top:${top}px;left:${izq};width:${anchoCss};height:${alto}px;background:${fondoCelda(tipo)==='transparent'?'var(--surface-2)':fondoCelda(tipo)};border-left:3px solid ${colorPorTipo(tipo)==='transparent'?'var(--line)':colorPorTipo(tipo)};${enConflicto?'outline:2px dashed var(--danger);outline-offset:-2px;':''}border-radius:5px;padding:3px 6px;overflow:hidden;cursor:grab;transition:filter .1s;box-sizing:border-box;touch-action:none;user-select:none;`;
      bloque.title = enConflicto ? 'Esta franja se solapa con otra a la vez' : '';
      bloque.innerHTML=`<div style="font-size:11.5px;font-weight:600;color:${textoColorParaTipo(tipo)};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${enConflicto?'⚠ ':''}${escapeHtml(textoLimpio(ev.valor))}</div>${alto>32?`<div style="font-size:10px;color:var(--ink-soft);">${ev.hora}–${sumarMinutos(ev.hora,ev.duracion)}</div>`:''}`;
      bloque.onmouseenter=()=>{ bloque.style.filter='brightness(1.15)'; bloque.style.zIndex='5'; };
      bloque.onmouseleave=()=>{ bloque.style.filter='none'; bloque.style.zIndex='auto'; };

      // Arrastre real (ratón y dedo, vía Pointer Events)
      let arrastrando=false, moved=false, startX=0, startY=0, origColumnaRect=null;
      bloque.addEventListener('pointerdown',(e)=>{
        if(e.button!==undefined && e.button!==0) return;
        arrastrando=true; moved=false;
        startX=e.clientX; startY=e.clientY;
        bloque.setPointerCapture(e.pointerId);
        bloque.style.cursor='grabbing';
      });
      bloque.addEventListener('pointermove',(e)=>{
        if(!arrastrando) return;
        const dx=e.clientX-startX, dy=e.clientY-startY;
        if(Math.abs(dx)>5 || Math.abs(dy)>5) moved=true;
        if(moved){
          bloque.style.zIndex='20';
          bloque.style.boxShadow='0 8px 20px rgba(0,0,0,.4)';
          bloque.style.transform=`translate(${dx}px,${dy}px)`;
          bloque.style.opacity='0.9';
        }
      });
      bloque.addEventListener('pointerup',(e)=>{
        if(!arrastrando) return;
        arrastrando=false;
        bloque.style.cursor='grab';
        bloque.style.transform='';
        bloque.style.boxShadow='';
        bloque.style.opacity='';
        bloque.style.zIndex='auto';
        if(!moved) return; // fue un clic normal, no un arrastre: el evento click ya se encarga
        // Determina la columna (día) bajo el punto final
        const cols = registroColumnas || [col];
        let colDestino = col;
        for(const c of cols){
          const r = c.getBoundingClientRect();
          if(e.clientX>=r.left && e.clientX<=r.right){ colDestino=c; break; }
        }
        const rectDestino = colDestino.getBoundingClientRect();
        const yRel = e.clientY - rectDestino.top;
        const minDestino = inicioMin + Math.round(yRel/PX_POR_MIN_TIMELINE/15)*15;
        const minAcotado = Math.max(inicioMin, Math.min(finMin-15, minDestino));
        const horaDestino = String(Math.floor(minAcotado/60)).padStart(2,'0')+':'+String(minAcotado%60).padStart(2,'0');
        const fechaDestino = colDestino.dataset.fecha;
        moverFranjaPorArrastre(fecha, ev.hora, fechaDestino, horaDestino, ev.valor);
      });
      bloque.addEventListener('click',(e)=>{
        e.stopPropagation();
        if(moved) return; // el arrastre ya se ha encargado, no abrir también el modal
        openMoverFranjaModal(fecha, ev.hora, ev.valor);
      });
      col.appendChild(bloque);
    });
  });
  return col;
}

// Guarda la duración real de una franja (si difiere de la hora en punto siguiente) y libera el resto de la hora
// esa semana concreta, para que no parezca ocupada cuando en realidad queda tiempo libre.
function eventosSolapados(fecha, iniMin, finMin, horaAExcluir){
  return construirEventosDelDia(fecha).filter(ev=>{
    if(ev.hora===horaAExcluir) return false;
    return ev.iniMin < finMin && ev.finMin > iniMin; // solape real de rangos horarios
  });
}
function verificarSolapeAntesDeGuardar(fecha, horaInicio, duracionMin, horaAExcluir, alTerminar){
  const iniMin = minutosDesdeMedianoche(horaInicio);
  const finMin = iniMin + duracionMin;
  const conflictos = eventosSolapados(fecha, iniMin, finMin, horaAExcluir===null?horaInicio:horaAExcluir);
  if(conflictos.length>0){
    const lista = conflictos.map(ev=>`"${textoLimpio(ev.valor)}" (${ev.hora}–${sumarMinutos(ev.hora,ev.duracion)})`).join(', ');
    showAvisoSolape(
      `Esto se solapa en el tiempo con: ${lista}. ¿Qué quieres hacer?`,
      alTerminar,
      ()=>{
        conflictos.forEach(ev=>{ horarioSet(fecha, ev.hora, ''); });
        alTerminar();
      }
    );
  } else {
    alTerminar();
  }
}
function aplicarDuracionFranja(fecha, horaInicio, duracionMin){
  const clave = fecha+'|'+horaInicio;
  if(!state.horario.duracionPorFranja) state.horario.duracionPorFranja = {};
  if(duracionMin===duracionPorDefecto(tipoCelda(horarioValor(fecha,horaInicio)))){
    delete state.horario.duracionPorFranja[clave];
  } else {
    state.horario.duracionPorFranja[clave] = duracionMin;
  }
  if(duracionMin < 60 && HORAS_BASE.includes(horaInicio)){
    const inicioLibre = sumarMinutos(horaInicio, duracionMin);
    if(!state.horario.horas.includes(inicioLibre)){ state.horario.horas.push(inicioLibre); state.horario.horas.sort(); }
    const claveLibre = fecha+'|'+inicioLibre;
    if(!state.horario.franjasReservadas.includes(claveLibre)) state.horario.franjasReservadas.push(claveLibre);
  }
}

  return (valor||'').replace(/^(🔵|🟣|🟠|⚪|📝)\s*/,'');
}

        </select>

      <div class="field"><label>Notas de esta franja (opcional)</label><textarea id="mv-notas" style="min-height:56px;" placeholder="Aclaraciones sobre este cliente, entrevista o grupo ese día...">${escapeHtml(state.horario.notasPorFranja[fecha+'|'+hora]||'')}</textarea></div>
      <div class="actions" style="margin-top:16px;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <button class="btn btn-danger" id="mv-eliminar">Eliminar franja</button>
        <button class="btn btn-accent" id="mv-confirm">Guardar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.close-x').onclick=()=>overlay.remove();
  overlay.onclick=(e)=>{ if(e.target===overlay) overlay.remove(); };
  crearAutocompleteTexto(overlay.querySelector('#mv-nombre'), nombresConocidosParaHorario);

  overlay.querySelector('#mv-eliminar').onclick=()=>{
    const modo = overlay.querySelector('#mv-modo').value;
    const valorTrasEliminar = tipoCelda(valor)==='oficina' ? '' : 'Oficina';
    const eliminar = ()=>{
      if(modo==='semana'){
        horarioSet(fecha, hora, valorTrasEliminar);
      } else {
        state.horario.grid[diaActual+'|'+hora] = valorTrasEliminar;
        delete state.horario.excepciones[fecha+'|'+hora];
        scheduleSave();
      }
      delete state.horario.notasPorFranja[fecha+'|'+hora];
      delete state.horario.duracionPorFranja[fecha+'|'+hora];
      overlay.remove(); render();
    };
    showConfirm(`¿Eliminar "${valor}" de ${diaActual} ${hora}${modo==='permanente'?' de forma permanente (todas las semanas)':' solo esta semana'}?`, eliminar);
  };

  const camposDiv = overlay.querySelector('#mv-campos');
  const duracionActual = duracionDeFranja(fecha, hora);
  function renderCampos(){
    const modo = overlay.querySelector('#mv-modo').value;
    const finActual = sumarMinutos(hora, duracionActual);
    if(modo==='semana'){
      camposDiv.innerHTML = `
        <div class="field-row">
          <div class="field"><label>Nueva fecha</label><input type="date" id="mv-fecha" value="${fecha}"></div>
          <div class="field"><label>Nueva hora</label><input type="time" step="900" id="mv-hora" value="${hora}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Hora de fin</label><input type="time" step="900" id="mv-hora-fin" value="${finActual}"></div>
        </div>`;
    } else {
      camposDiv.innerHTML = `
        <div class="field-row">
          <div class="field"><label>Nuevo día</label>
            <select id="mv-dia">${['Lunes','Martes','Miércoles','Jueves','Viernes'].map(d=>`<option value="${d}" ${d===diaActual?'selected':''}>${d}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Nueva hora</label><input type="time" step="900" id="mv-hora" value="${hora}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Hora de fin</label><input type="time" step="900" id="mv-hora-fin" value="${finActual}"></div>
        </div>`;
    }
    let finTocadaAMano=false;
    overlay.querySelector('#mv-hora-fin').addEventListener('input', ()=>{ finTocadaAMano=true; });
    overlay.querySelector('#mv-hora').addEventListener('input', (e)=>{
      if(finTocadaAMano) return;
      const tipoSel = overlay.querySelector('#mv-tipo').value;
      overlay.querySelector('#mv-hora-fin').value = sumarMinutos(e.target.value, duracionPorDefecto(tipoSel));
    });
    overlay.querySelector('#mv-tipo').addEventListener('change', (e)=>{
      finTocadaAMano=false;
      const horaBase = overlay.querySelector('#mv-hora').value;
      if(horaBase) overlay.querySelector('#mv-hora-fin').value = sumarMinutos(horaBase, duracionPorDefecto(e.target.value));
    });
  }
  renderCampos();
  overlay.querySelector('#mv-modo').onchange=renderCampos;

  overlay.querySelector('#mv-confirm').onclick=()=>{
    const modo = overlay.querySelector('#mv-modo').value;
    let nuevaHora = overlay.querySelector('#mv-hora').value;
    if(!nuevaHora){ showAlert('Indica una hora de destino.'); return; }
    const nuevoTipo = overlay.querySelector('#mv-tipo').value;
    if(nuevoTipo==='entrevista') nuevaHora = redondearAMediaHora(nuevaHora);
    const horaFinElegida = overlay.querySelector('#mv-hora-fin').value || sumarMinutos(nuevaHora, duracionPorDefecto(nuevoTipo));
    const duracionMin = minutosEntreHoras(nuevaHora, horaFinElegida);
    const textoActual = overlay.querySelector('#mv-nombre').value.trim() || textoLimpio(valor);
    const valorConTipo = nuevoTipo==='oficina' ? 'Oficina' : (PREFIJO_TIPO[nuevoTipo]||'') + textoActual;
    const notaActual = overlay.querySelector('#mv-notas').value.trim();

    const ejecutar = ()=>{
      const escribirDeVerdad = ()=>{
        if(!state.horario.horas.includes(nuevaHora) && valorConTipo.trim()){ state.horario.horas.push(nuevaHora); state.horario.horas.sort(); }
        let nuevaFechaFinal = fecha;
        if(modo==='semana'){
          const nuevaFecha = overlay.querySelector('#mv-fecha').value;
          nuevaFechaFinal = nuevaFecha;
          horarioSet(nuevaFecha, nuevaHora, valorConTipo);
          if(nuevaFecha!==fecha || nuevaHora!==hora){
            horarioSet(fecha, hora, '');
          }
          if(valorConTipo.trim()) aplicarDuracionFranja(nuevaFecha, nuevaHora, duracionMin);
        } else {
          const nuevoDia = overlay.querySelector('#mv-dia').value;
          gridVigentePara(fecha)[nuevoDia+'|'+nuevaHora] = valorConTipo;
          if(nuevoDia!==diaActual || nuevaHora!==hora){
            gridVigentePara(fecha)[diaActual+'|'+hora] = '';
            limpiarExcepcionesDeDia(diaActual, hora);
          }
          limpiarExcepcionesDeDia(nuevoDia, nuevaHora);
          delete state.horario.excepciones[fecha+'|'+hora];
          scheduleSave();
          if(valorConTipo.trim()) aplicarDuracionFranja(fecha, nuevaHora, duracionMin);
        }
        if(nuevaFechaFinal!==fecha || nuevaHora!==hora){
          delete state.horario.notasPorFranja[fecha+'|'+hora];
          delete state.horario.duracionPorFranja[fecha+'|'+hora];
        }
        if(notaActual) state.horario.notasPorFranja[nuevaFechaFinal+'|'+nuevaHora] = notaActual;
        else delete state.horario.notasPorFranja[nuevaFechaFinal+'|'+nuevaHora];
        overlay.remove(); render();
      };
      const continuarConSolape = ()=>{
        if(valorConTipo.trim()){
          const fechaParaComprobar = modo==='semana' ? (overlay.querySelector('#mv-fecha').value||fecha) : fecha;
          verificarSolapeAntesDeGuardar(fechaParaComprobar, nuevaHora, duracionMin, hora, escribirDeVerdad);
        } else {
          escribirDeVerdad();
        }
      };
      const esPermanenteMover = modo!=='semana';
      const diaParaAviso = esPermanenteMover ? overlay.querySelector('#mv-dia').value : nombreDiaEs(overlay.querySelector('#mv-fecha').value||fecha);
      avisarSiClienteInactivoYContinuar((overlay.querySelector('#mv-fecha')?overlay.querySelector('#mv-fecha').value:fecha)||fecha, nuevaHora, valorConTipo, esPermanenteMover, diaParaAviso, continuarConSolape);
    };

    let destinoOcupado;
    let esMismaFranja;
    if(modo==='semana'){
      const nuevaFecha = overlay.querySelector('#mv-fecha').value;
      if(!nuevaFecha){ showAlert('Indica una fecha de destino.'); return; }
      esMismaFranja = (nuevaFecha===fecha && nuevaHora===hora);
      destinoOcupado = esMismaFranja ? '' : horarioValor(nuevaFecha, nuevaHora);
    } else {
      const nuevoDia = overlay.querySelector('#mv-dia').value;
      esMismaFranja = (nuevoDia===diaActual && nuevaHora===hora);
      destinoOcupado = esMismaFranja ? '' : (state.horario.grid[nuevoDia+'|'+nuevaHora] || '');
    }
    if(destinoOcupado && destinoOcupado.trim().toLowerCase()!=='oficina'){
      showConfirm(`Ese hueco ya tiene "${destinoOcupado}". ¿Sobrescribir?`, ejecutar);
    } else {
      ejecutar();
    }
  };
}

function horarioDiaView(){

  hint.textContent='Haz clic en una franja ocupada para moverla a otro día/hora, o arrástrala directamente.';
  wrap.appendChild(hint);

  const tableWrap=document.createElement('div'); tableWrap.style.cssText='overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-width:420px;';
  const table=document.createElement('table'); table.style.cssText='border-collapse:collapse;width:100%;font-size:13px;';
  const horasAMostrar = state.horario.horas.filter(hora=>{
    if(HORAS_BASE.includes(hora)) return true;
    return !esOficinaOVacio(horarioValor(horarioFecha,hora)) || (state.horario.franjasReservadas||[]).includes(horarioFecha+'|'+hora);
  });
  horasAMostrar.forEach((hora,idx)=>{
    if(esFranjaContinuacion(horarioFecha, hora)) return; // se fusiona con la fila anterior (rowspan)
    const tr=document.createElement('tr');
    const tdHora=document.createElement('td'); tdHora.style.cssText=tdStyle(true); tdHora.textContent=hora;
    const td=document.createElement('td'); td.style.cssText=tdStyle(false);
    renderCellContent(td, horarioFecha, hora);

    let span=1;
    while(idx+span<horasAMostrar.length && esFranjaContinuacion(horarioFecha, horasAMostrar[idx+span])) span++;
    if(span>1) td.rowSpan = span;
    tr.appendChild(tdHora); tr.appendChild(td);

  });
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);
  return wrap;
}

function horarioMesView(){
  const wrap=document.createElement('div');

  const year=ref.getFullYear(), month=ref.getMonth();
  const tituloEl=document.createElement('h3'); tituloEl.style.cssText='margin-bottom:10px;text-transform:capitalize;';
  tituloEl.textContent = ref.toLocaleDateString('es-ES',{month:'long',year:'numeric'});

  const firstOfMonth = new Date(year,month,1);
  let cursor = fromDate(firstOfMonth);
  cursor = startOfWeekStr(cursor);

  const grid=document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:repeat(5,1fr);gap:8px;';
  const dayHeaders=['Lun','Mar','Mié','Jue','Vie'];
  dayHeaders.forEach(dh=>{

    dhEl.textContent=dh; grid.appendChild(dhEl);
  });

  let d = cursor;
  for(let week=0; week<6; week++){
    for(let i=0;i<5;i++){
      const inMonth = toDate(d).getMonth()===month;
      const cell=document.createElement('div');
      cell.style.cssText=`border:1px solid var(--line);border-radius:8px;padding:8px;min-height:64px;cursor:pointer;background:${d===todayStr()?'rgba(203,158,234,.1)':'var(--surface)'};opacity:${inMonth?1:0.4};`;
      const count = state.horario.horas.filter(hora=>{
        const v=horarioValor(d,hora).trim().toLowerCase();
        return v && v!=='oficina';
      }).length;
      cell.innerHTML = `<div style="font-size:12px;color:var(--ink-soft);">${toDate(d).getDate()}</div>${count>0?`<div style="margin-top:4px;font-size:11px;color:var(--accent);font-weight:600;">${count} ${count>1?'sesiones':'sesión'}</div>`:''}`;
      const dCapture=d;
      cell.onclick=()=>{ horarioFecha=dCapture; horarioModo='dia'; render(); };
      grid.appendChild(cell);
      d = addDaysStr(d,1);
    }
    d = addDaysStr(d,2); // saltar sábado y domingo antes de la siguiente fila
  }
  wrap.appendChild(grid);
  return wrap;
}

function conectarBuscadorGlobal(gsInput, gsResults){
  gsInput.oninput=()=>{
    const q = normalizarBusqueda(gsInput.value.trim());
    if(!q){ gsResults.style.display='none'; gsResults.innerHTML=''; return; }
    const clientesMatch = state.clients.filter(c=>normalizarBusqueda(c.nombre).includes(q)).slice(0,6);
    const ejerciciosMatch = state.exercises.filter(e=>normalizarBusqueda(e.nombre).includes(q)).slice(0,6);
    let html='';
    if(clientesMatch.length){
      html += `<div style="padding:6px 10px;font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.06em;">Clientes</div>`;
      clientesMatch.forEach(c=>{
        html += `<div class="gs-item" data-tipo="cliente" data-id="${c.id}" style="padding:8px 10px;cursor:pointer;font-size:13px;">${escapeHtml(c.nombre)}</div>`;
      });
    }
    if(ejerciciosMatch.length){
      html += `<div style="padding:6px 10px;font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.06em;">Ejercicios</div>`;
      ejerciciosMatch.forEach(ex=>{
        html += `<div class="gs-item" data-tipo="ejercicio" data-id="${ex.id}" style="padding:8px 10px;cursor:pointer;font-size:13px;">${escapeHtml(ex.nombre)}</div>`;
      });
    }
    if(!clientesMatch.length && !ejerciciosMatch.length){
      html = `<div style="padding:10px;font-size:12.5px;color:var(--ink-soft);">Sin resultados</div>`;
    }
    gsResults.innerHTML = html;
    gsResults.style.display='block';
    gsResults.querySelectorAll('.gs-item').forEach(item=>{
      item.onmouseenter=()=>{ item.style.background='var(--surface-2)'; };
      item.onmouseleave=()=>{ item.style.background='transparent'; };
      item.onclick=(e)=>{
        e.preventDefault();
        if(item.dataset.tipo==='cliente'){
          const cliente = state.clients.find(c=>c.id===item.dataset.id);
          if(cliente){
            appScreen = cliente.pareja===undefined && appScreen==='grupos' ? 'grupos' : 'personal';
            state.activeTab='sesiones';
            state.activeClientId=cliente.id;
            render();
          }
        } else {
          appScreen = appScreen==='grupos' ? 'grupos' : 'personal';
          state.activeTab='bateria';
          render();
          setTimeout(()=>openExerciseModal(item.dataset.id), 50);
        }
      };
    });
  };
  gsInput.onblur=()=>{ setTimeout(()=>{ gsResults.style.display='none'; }, 150); };
}

function tabsEl(){
