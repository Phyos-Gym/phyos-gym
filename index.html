function mediaDificultadSemana(items){
  const valores=[];
  items.forEach(it=>{
    if(typeof it.dificultad==='number') valores.push(it.dificultad);
    if(it.a && typeof it.a.dificultad==='number') valores.push(it.a.dificultad);
    if(it.b && typeof it.b.dificultad==='number') valores.push(it.b.dificultad);
  });
  if(valores.length===0) return null;
  return valores.reduce((a,b)=>a+b,0)/valores.length;
}

function weekBlock(unitClients, program, week, wIdx){
  if(!week.id) week.id = uid();
  const isPair = unitClients.length===2;
  const block=document.createElement('div'); block.className='week-block';
  const colapsada = semanasColapsadas.has(week.id);

  arrowBtn.innerHTML = flechaColapso(colapsada);

      const itemColapsado = itemsColapsados.has(item.id);
      const wrap=document.createElement('div'); wrap.className='pair-item';
      if(item.supersetId){

// ---------- GENERADOR ALEATORIO ----------
function clientRiskText(client){
  return [client.salud.lesionOperacion, client.salud.evitar, client.salud.sintomas, client.notas]
    .filter(Boolean).join(' ').toLowerCase();
}
// Detecta si un cliente necesita ejercicios sencillos y de baja complejidad: por una discapacidad física/intelectual señalada
// en su diagnóstico o notas, o por tener un nivel de forma física muy bajo — no basta con evitar zonas de riesgo concretas,
// también hay que evitar movimientos técnicamente exigentes aunque no toquen ninguna zona lesionada.
const PALABRAS_NECESITA_SIMPLICIDAD = ['discapacidad intelectual','discapacidad física e intelectual','discapacidad psíquica','discapacidad psiquica','discapacidad cognitiva','meningitis de nacimiento','instrucciones simples','instrucciones claras','apoyo verbal constante'];
function clienteNecesitaEjerciciosSimples(client){
  const diagnostico = (client.salud && client.salud.diagnostico) || '';
  const notas = client.notas || '';
  const texto = (diagnostico + ' ' + notas).toLowerCase();
  const mencionaDiscapacidad = PALABRAS_NECESITA_SIMPLICIDAD.some(p=>texto.includes(p));
  const nivelMuyBajo = client.cuerpo && (client.cuerpo.nivelForma||'').toLowerCase().includes('muy bajo');
  return mencionaDiscapacidad || nivelMuyBajo;
}
function isExerciseSafeForClient(ex, client, nivelElegido){
  if(ex.zonasRiesgo){
    const riskText = clientRiskText(client);
    if(riskText.trim()){
      const tags = ex.zonasRiesgo.split(',').map(t=>t.trim().toLowerCase()).filter(Boolean);
      if(tags.some(tag=>tag && riskText.includes(tag))) return false;
    }
  }
  // La restricción a ejercicios sencillos es el criterio por defecto, pero si el entrenador pide expresamente
  // una sesión "Dura" para esta persona, se respeta esa decisión profesional en vez de bloquearla sola.
  if(nivelElegido!=='duro' && clienteNecesitaEjerciciosSimples(client) && nivelDificultadEjercicio(ex)==='duro') return false;
  return true;
}
function isExerciseSafeForUnit(ex, unitClients, nivelElegido){
  return unitClients.every(c=>isExerciseSafeForClient(ex, c, nivelElegido));
}
// Elige UN ejercicio nuevo para añadir a una semana ya existente: no repite ejercicios ya presentes,
// y prioriza las zonas musculares menos trabajadas hasta ahora en esa semana, para repartir el esfuerzo.
function elegirEjercicioAleatorioParaAñadir(week, poolBase){
  const yaUsados = new Set(week.items.map(it=>it.exerciseId));
  const candidatos = poolBase.filter(ex=>!yaUsados.has(ex.id));
  if(candidatos.length===0) return null;
  const conteoGrupos = {};
  week.items.forEach(it=>{
    const ex = state.exercises.find(e=>e.id===it.exerciseId);
    if(!ex) return;
    const clave = (ex.grupoMuscular||'General').split('/')[0].trim();
    conteoGrupos[clave] = (conteoGrupos[clave]||0) + 1;
  });
  const conteoDe = (ex)=> conteoGrupos[(ex.grupoMuscular||'General').split('/')[0].trim()] || 0;
  const conteoMinimo = Math.min(...candidatos.map(conteoDe));
  const mejores = candidatos.filter(ex=>conteoDe(ex)===conteoMinimo);
  return mejores[Math.floor(Math.random()*mejores.length)];
}
function añadirEjercicioAleatorioAWeek(week, poolBase, construirItem, tituloUnidad){
  const elegido = elegirEjercicioAleatorioParaAñadir(week, poolBase);
  if(!elegido){
    showAlert(`No queda ningún ejercicio seguro y distinto de los ya presentes para ${tituloUnidad}. Añade uno a mano desde "+ Añadir ejercicio", o revisa si hay que ampliar la Batería.`);
    return;
  }
  week.items.push(construirItem(elegido));
  marcarModificada(week);
  scheduleSave();
  render();
}

function esEjercicioCardioContinuo(ex){
  const mat = (ex.material||'').toLowerCase();
  const grupo = (ex.grupoMuscular||'').toLowerCase();
  return mat.includes('bici ciclo indoor') || grupo.includes('cardio');
}
function segundosDeDescanso(str){
  const m = (str||'').match(/(\d+)/);
  return m ? parseInt(m[1]) : 30;
}
function estimarSegundosEjercicio(ex, series, descansoStr){
  if(esEjercicioCardioContinuo(ex)) return 17*60; // punto medio de "15-20 min"
  const s = parseInt(series)||3;
  return s * (35 + segundosDeDescanso(descansoStr)); // ~35s por serie realizando el ejercicio + su descanso
}
// La sesión de 60 min se reparte así: ~10 min calentamiento + bloque principal + ~5 min enfriamiento (regla ya fijada del proyecto)
const PRESUPUESTO_SESION_SEG = 60*60;
const RESERVA_CALENTAMIENTO_ENFRIAMIENTO_SEG = 13*60;
function construirSesionPorPresupuesto(disponibles, opciones){
  const repsOptions = opciones.repsOptions;
  const restOptions = opciones.restOptions;
  const equilibrarGrupos = opciones.equilibrarGrupos !== false;
  const presupuesto = PRESUPUESTO_SESION_SEG - RESERVA_CALENTAMIENTO_ENFRIAMIENTO_SEG;

  let ordenEjercicios;
  if(equilibrarGrupos){
    // Sin un grupo muscular concreto elegido: reparte por todo el cuerpo. Agrupa por zona,
    // baraja el orden de las zonas y el interior de cada una, y va turnando entre zonas
    // para no caer por azar en ejercicios de una sola parte del cuerpo.
    const buckets = {};
    disponibles.forEach(ex=>{
      const clave = (ex.grupoMuscular||'General').split('/')[0].trim();
      if(!buckets[clave]) buckets[clave]=[];
      buckets[clave].push(ex);
    });
    const claves = Object.keys(buckets).sort(()=>Math.random()-0.5);
    claves.forEach(k=>{ buckets[k].sort(()=>Math.random()-0.5); });
    ordenEjercicios = [];
    let quedan = true;
    while(quedan){
      quedan = false;
      for(const k of claves){
        if(buckets[k].length>0){
          ordenEjercicios.push(buckets[k].shift());
          quedan = true;
        }
      }
    }
  } else {
    ordenEjercicios = [...disponibles].sort(()=>Math.random()-0.5);
  }

  const chosen = [];
  let tiempoAcumulado = 0;
  for(const ex of ordenEjercicios){
    if(chosen.length>=10) break;
    const cardio = esEjercicioCardioContinuo(ex);
    const series = cardio ? '1' : '3';
    const descanso = cardio ? '—' : restOptions[chosen.length%restOptions.length];
    const dur = estimarSegundosEjercicio(ex, series, descanso);
    if(tiempoAcumulado + dur > presupuesto && chosen.length>=4) continue;
    chosen.push({ ex, series, reps: cardio?'15-20 min':repsOptions[chosen.length%repsOptions.length], descanso, segundos: dur });
    tiempoAcumulado += dur;
    if(tiempoAcumulado >= presupuesto*0.9) break;
  }
  return chosen;
}

// Multi-selección compacta con buscador: escribes, aparecen sugerencias, seleccionas varias y quedan como chips
function crearMultiSelectBuscable(inputEl, chipsContainer, opciones){
  let seleccionados = [];
  const wrapperPos=document.createElement('div'); wrapperPos.style.cssText='position:relative;';
  inputEl.parentNode.insertBefore(wrapperPos, inputEl);
  wrapperPos.appendChild(inputEl);
  const dropdown=document.createElement('div');
  dropdown.style.cssText='position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-top:2px;max-height:170px;overflow-y:auto;z-index:70;display:none;box-shadow:0 6px 18px rgba(0,0,0,.35);';
  wrapperPos.appendChild(dropdown);

  function renderChips(){
    chipsContainer.innerHTML = seleccionados.map(v=>`<span class="tag" data-val="${escapeHtml(v)}" style="display:inline-flex;align-items:center;gap:5px;">${escapeHtml(v)}<button type="button" style="background:none;border:none;color:inherit;cursor:pointer;padding:0;font-size:12px;line-height:1;">✕</button></span>`).join('');
    chipsContainer.querySelectorAll('.tag button').forEach(btn=>{
      btn.onclick=()=>{
        seleccionados = seleccionados.filter(v=>v!==btn.parentElement.dataset.val);
        renderChips();
      };
    });
  }
  function mostrarSugerencias(){
    const q = normalizarBusqueda(inputEl.value.trim());
    const disponibles = opciones.filter(o=>!seleccionados.includes(o));
    const filtradas = q ? disponibles.filter(o=>normalizarBusqueda(o).includes(q)) : disponibles;
    if(filtradas.length===0){ dropdown.style.display='none'; dropdown.innerHTML=''; return; }
    dropdown.innerHTML = filtradas.slice(0,40).map(o=>`<div class="ac-item" data-v="${escapeHtml(o)}" style="padding:7px 10px;font-size:12.5px;cursor:pointer;color:var(--ink);">${escapeHtml(o)}</div>`).join('');
    dropdown.querySelectorAll('.ac-item').forEach(item=>{
      item.onmouseenter=()=>{ item.style.background='var(--surface-2)'; };
      item.onmouseleave=()=>{ item.style.background='transparent'; };
      item.onclick=(e)=>{
        e.preventDefault();
        seleccionados.push(item.dataset.v);
        inputEl.value='';
        renderChips();
        dropdown.style.display='none';
      };
    });
    dropdown.style.display='block';
  }
  inputEl.addEventListener('input', mostrarSugerencias);
  inputEl.addEventListener('focus', mostrarSugerencias);
  inputEl.addEventListener('blur', ()=>{ setTimeout(()=>{ dropdown.style.display='none'; }, 150); });
  renderChips();
  return { getSeleccionados: ()=>seleccionados };
}
function conectarFiltrosGeneracion(overlay){
  const gruposEspecificos = [...new Set(state.exercises.map(e=>e.grupoMuscular).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  const gruposOrdenados = ['Tren superior','Tren inferior', ...gruposEspecificos];
  const materiales = [...new Set(state.exercises.flatMap(e=>(e.material||'').split(',').map(m=>m.trim()).filter(Boolean)))].sort((a,b)=>a.localeCompare(b,'es'));
  const ctrlGrupos = crearMultiSelectBuscable(overlay.querySelector('#rw-grupos-buscar'), overlay.querySelector('#rw-grupos-chips'), gruposOrdenados);
  const ctrlMateriales = crearMultiSelectBuscable(overlay.querySelector('#rw-materiales-buscar'), overlay.querySelector('#rw-materiales-chips'), materiales);
  let nivelElegido = 'normal';
  const botonesNivel = overlay.querySelectorAll('.rw-nivel-btn');
  function pintarNivel(){
    botonesNivel.forEach(b=>{ b.classList.toggle('btn-accent', b.dataset.val===nivelElegido); });
  }
  botonesNivel.forEach(b=>{ b.onclick=()=>{ nivelElegido=b.dataset.val; pintarNivel(); }; });
  pintarNivel();
  return { leer: ()=>({ grupos: ctrlGrupos.getSeleccionados(), materiales: ctrlMateriales.getSeleccionados(), nivel: nivelElegido }) };
}
const PALABRAS_TREN_INFERIOR = ['pierna','glúteo','gluteo','cuádriceps','cuadriceps','isquiotibial','gemelo','cadera','aductor','sóleo','soleo','tobillo','rodilla'];
const PALABRAS_TREN_SUPERIOR = ['pecho','espalda','hombro','brazo','bíceps','biceps','tríceps','triceps','dorsal','trapecio','antebrazo','muñeca'];
function grupoMuscularCoincideConFiltro(grupoMuscular, filtro){
  const texto = (grupoMuscular||'').toLowerCase();
  if(filtro==='Tren superior') return PALABRAS_TREN_SUPERIOR.some(p=>texto.includes(p));
  if(filtro==='Tren inferior') return PALABRAS_TREN_INFERIOR.some(p=>texto.includes(p));
  return grupoMuscular===filtro;
}
// Clasifica la intensidad de un ejercicio a partir de su nombre/descripción/precauciones,
// ya que no guardamos un nivel de dificultad propio en cada ejercicio.
const PALABRAS_NIVEL_DURO = ['salto','saltar','explosiv','burpee','sprint','máxima','maxima','pliométric','pliometric','plyo','muy avanzado','nivel avanzado','swing','arranque','sled','carga pesada','box jump','squat jump','jump','potencia','impacto alto','hyrox','wallball slam','sacacorchos','boomerang','control balance','navaja','jack knife','equilibrio de control'];
const PALABRAS_NIVEL_SUAVE = ['estiramiento','movilidad','respirac','activaci','rodamiento','liberación miofascial','liberacion miofascial','báscula','bascula','marcha en el sitio','marcha suave','muy suave','calentamiento','equilibrio bipodal','pausa','suave','descanso activo','apertura','iniciación','iniciacion','nivel bajo','muy accesible'];
function nivelDificultadEjercicio(ex){
  const texto = ((ex.nombre||'')+' '+(ex.descripcion||'')+' '+(ex.precauciones||'')).toLowerCase();
  let puntuacion = 0;
  PALABRAS_NIVEL_DURO.forEach(p=>{ if(texto.includes(p)) puntuacion+=1; });
  PALABRAS_NIVEL_SUAVE.forEach(p=>{ if(texto.includes(p)) puntuacion-=1; });
  if(esEjercicioCardioContinuo(ex)) puntuacion+=0; // el cardio se regula solo por duración, no cuenta como "duro" per se
  if(puntuacion>=1) return 'duro';
  if(puntuacion<=-1) return 'suave';
  return 'normal';
}
function aplicarFiltrosGeneracion(pool, filtros){
  let resultado = pool;
  if(filtros.grupos.length>0) resultado = resultado.filter(ex=>filtros.grupos.some(g=>grupoMuscularCoincideConFiltro(ex.grupoMuscular, g)));
  if(filtros.materiales.length>0) resultado = resultado.filter(ex=>{
    const materialesEx = (ex.material||'').split(',').map(m=>m.trim());
    return filtros.materiales.some(m=>materialesEx.includes(m));
  });
  if(filtros.nivel && filtros.nivel!=='normal'){
    const filtradoPorNivel = resultado.filter(ex=>nivelDificultadEjercicio(ex)===filtros.nivel);
    // Si el filtro de nivel deja muy pocos ejercicios, mezclamos con "normal" para no quedarnos sin variedad
    if(filtradoPorNivel.length>=6) resultado = filtradoPorNivel;
    else resultado = [...filtradoPorNivel, ...resultado.filter(ex=>nivelDificultadEjercicio(ex)==='normal')];
  } else if(filtros.nivel==='normal'){
    // "Normal" prioriza ejercicios normales, pero no descarta el resto si hacen falta para completar la sesión
    const normales = resultado.filter(ex=>nivelDificultadEjercicio(ex)==='normal');
    if(normales.length>=6) resultado = normales;
  }
  return resultado;
}

function generateRandomWeek(program, week, unitClients){
  if(state.exercises.length===0){
    showAlert('La batería de ejercicios está vacía. Añade ejercicios primero en la pestaña "Batería de ejercicios" para poder generar sesiones aleatorias.');
    return;
  }
  const isPair = unitClients.length===2;

  const pedirDias = ()=>{
    const overlay=document.createElement('div'); overlay.className='overlay';
    overlay.innerHTML=`
      <div class="modal" style="max-width:400px;">
        <div class="modal-head"><h2>Generar semana aleatoria</h2><button class="close-x">✕</button></div>
        <div class="field"><label>¿Cuántos días de entrenamiento distintos tendrá esta semana?</label><input type="number" id="rw-dias" value="1" min="1" max="6"></div>
        <p style="font-size:12px;color:var(--ink-soft);margin-top:-4px;">Se generará una sesión distinta (sin repetir ejercicios entre ellas) para cada día que indiques.</p>
        ${htmlFiltrosGeneracion()}
        <div class="actions" style="margin-top:14px;justify-content:flex-end;">
          <button class="btn btn-accent" id="rw-confirm">Generar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('.close-x').onclick=()=>overlay.remove();
    overlay.onclick=(e)=>{ if(e.target===overlay) overlay.remove(); };
    const filtrosCtrl = conectarFiltrosGeneracion(overlay);
    overlay.querySelector('#rw-confirm').onclick=()=>{
      const dias = Math.max(1, Math.min(6, parseInt(overlay.querySelector('#rw-dias').value)||1));
      const filtros = filtrosCtrl.leer();
      overlay.remove();
      doGenerate(dias, filtros);
    };
  };

  const doGenerate = (numDias, filtros)=>{
    let pool = state.exercises.filter(ex=>isExerciseSafeForUnit(ex, unitClients, filtros.nivel));
    // Las dinámicas de grupo (relevos, circuitos por equipos, juegos grupales...) no son viables para 1 o 2 personas
    pool = pool.filter(ex=>!ex.esDinamicaGrupal);
    if(!isPair){
      // En sesiones individuales no tiene sentido sugerir ejercicios pensados para ejecutarse en pareja
      pool = pool.filter(ex=>!ex.esPareja);
    }
    pool = aplicarFiltrosGeneracion(pool, filtros);
    if(pool.length===0){
      showAlert('Ningún ejercicio de la batería cumple los filtros elegidos (grupo muscular / material) y a la vez es seguro para este cliente/pareja. Prueba a quitar algún filtro o añade ejercicios alternativos en la Batería.');
      return;
    }
    // Evita repetir exactamente los mismos ejercicios usados en otras semanas del mismo plan, para forzar variedad real
    const usedElsewhere = new Set();
    program.weeks.forEach(w=>{
      if(w===week) return;
      w.items.forEach(it=>usedElsewhere.add(it.exerciseId));
    });
    let freshPool = pool.filter(ex=>!usedElsewhere.has(ex.id));
    if(freshPool.length < 4*numDias) freshPool = pool; // si no hay suficientes ejercicios nuevos, se permite repetir alguno

    const repsOptions = ['10','12','15'];
    const restOptions = ['30s','45s','60s'];
    const usadosEnEstaSemana = new Set();
    const newItems = [];

    for(let dia=1; dia<=numDias; dia++){
      let disponibles = freshPool.filter(ex=>!usadosEnEstaSemana.has(ex.id));
      if(disponibles.length < 6) disponibles = freshPool; // si se agota la variedad, se permite repetir entre días de la misma semana
      const chosen = construirSesionPorPresupuesto(disponibles, {repsOptions, restOptions, equilibrarGrupos: filtros.grupos.length===0});
      chosen.forEach(c=>usadosEnEstaSemana.add(c.ex.id));

      chosen.forEach(({ex, series, reps, descanso})=>{
        if(!isPair){
          newItems.push({ exerciseId: ex.id, diaSesion: numDias>1?dia:undefined, series, reps, carga:'', descanso, notas:'' });
        } else {
          const esPareja = !!ex.esPareja;
          newItems.push({
            exerciseId: ex.id,
            diaSesion: numDias>1?dia:undefined,
            esPareja,
            a: { series, reps, carga:'', descanso, notas:'' },
            b: { series, reps, carga:'', descanso, notas:'' },
          });
        }
      });
    }
    week.items = newItems;
    scheduleSave(); render();
  };

  if(week.items.length>0){
    showConfirm('Esto sustituirá los ejercicios actuales de esta semana por una selección aleatoria (respetando las precauciones del cliente, ajustada a sesiones de 60 minutos). ¿Continuar?', pedirDias);
  } else {
    pedirDias();
  }
}

// ---------- init ----------
(async function init(){
  root.innerHTML = '<div style="padding:60px;text-align:center;color:#5B6A60;font-family:Inter,sans-serif;">Cargando cuaderno de entrenamiento…</div>';
  await loadState();
  render();
  setTimeout(comprobarVersionNueva, 3000); // comprueba poco después de abrir, sin bloquear la carga
  setInterval(comprobarVersionNueva, 5*60*1000); // y cada 5 minutos mientras la app siga abierta
})();
</script>
